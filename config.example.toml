# Copy to `config.toml` and fill in. `config.toml` is gitignored (it holds secrets).
# Override the path with the HEARTH_CONFIG env var.

# Everything below except [ambient] is optional. Omit any section to take its
# defaults (or, for a source, to disable it entirely — no task is then spawned).

# Optional. "imperial" (°F, inHg, mph, in) or "metric" (°C, hPa, km/h, mm).
# Defaults to "imperial".
unit_system = "imperial"

[ambient]
# From https://ambientweather.net account -> account settings -> API keys.
application_key = "your-ambient-application-key"
api_key = "your-ambient-api-key"
mac_address = "AA:BB:CC:DD:EE:FF"

# Optional. Omit the whole section to take the default.
[poll]
# REST poll interval (seconds) for every poll source; defaults to 60. Push
# sources (Dyson) ignore it. Also the tick for the Whisker history archive.
interval_secs = 60

# Optional: enable the EcoFlow source. Omit this whole section to disable it
# (the poll loop then never touches EcoFlow).
# [ecoflow]
# # From https://developer.ecoflow.com -> your app's IoT Open API credentials.
# access_key = "your-ecoflow-access-key"
# secret_key = "your-ecoflow-secret-key"
# # Device serial numbers to poll. Leave empty/omit to auto-discover them from
# # the device-list endpoint at each poll.
# device_sns = ["R331ZEB4ZEAL0001"]
# # base_url = "https://api-e.ecoflow.com"   # default (US/global host)

# Optional: enable the Schlage source — a Schlage Wi-Fi lock's state (locked /
# unlocked / jammed + battery %) polled from Schlage's cloud onto the bus
# (visible via the [api] sink / watch tile). Omit this whole section to disable
# it (no Schlage task is then spawned).
#
# NOTE: this uses Schlage's UNOFFICIAL, reverse-engineered cloud API (the same
# one the Schlage Home app uses). There is no public/official API — it can break
# whenever Schlage changes it. Auth is AWS Cognito SRP with your Schlage Home
# account; credentials are held in memory only (never persisted).
# [schlage]
# username = "you@example.com"   # your Schlage Home account email
# password = "your-schlage-home-password"

# Optional: enable the Whisker source — a Litter-Robot 5 (LR5). Surfaces each
# cat's measured weight (the pet-profile feed) plus the two "time to change it"
# signals per box — a full waste drawer and low litter. Surfaced via the [api]
# sink / watch tile. Omit this whole section to disable it (no Whisker task is
# then spawned).
#
# NOTE: this uses Whisker's UNOFFICIAL, reverse-engineered cloud API (the same
# one the Litter-Robot app uses). There is no public/official API — it can break
# whenever Whisker changes it. Auth is AWS Cognito SRP with your Whisker account;
# credentials are held in memory only (never persisted).
# [whisker]
# username = "you@example.com"   # your Whisker (Litter-Robot) account email
# password = "your-whisker-password"
# # Optional: surface only this LR5 serial (filters the account's robots).
# # Leave unset to surface every Litter-Robot on your account.
# # serial = "LR5-0123456789"
# # Optional: directory for the forever weight-history archive (visits.jsonl).
# # hearth appends every PET_VISIT (per-cat weight + waste) here, so you keep a
# # permanent record even though Whisker's cloud only retains ~30 days. Holds
# # personal pet data (kept out of git, chmod 0600). Defaults to `data/whisker`.
# # Seed it from a saved snapshot with:  hearth whisker-history-import <snapshot-dir>
# # This archive is ALSO what the dashboard's weight sparklines and per-cat
# # charts read (GET /api/history, GET /api/visits). If it is missing or
# # unreadable those endpoints return empty and the page silently falls back to
# # its embedded snapshot — no error is surfaced.
# # history_dir = "data/whisker"
# # Optional but STRONGLY recommended: dated backups of that archive. It is the
# # only copy of this history beyond ~30 days (Whisker's cloud forgets the rest),
# # so losing it loses it permanently. hearth writes one full copy per UTC day,
# # `visits-YYYY-MM-DD.jsonl`, atomically and chmod 0600, keeping the newest
# # `backup_keep` (default 14; 0 = keep forever). Unset = NO backups.
# # Point this at a DIFFERENT PHYSICAL DISK (or a mounted NAS) — a backup on the
# # archive's own disk dies with it, and hearth logs a warning if it detects that.
# # backup_dir = "/mnt/other-disk/hearth-backups/whisker"
# # backup_keep = 14
# # "Needs service" alert thresholds. Each box emits `whisker.<box>.needs_service`
# # (opens when the drawer is at/over drawer_full_pct, the litter is at/under
# # litter_low_pct, the drawer reports full, or the box is offline). Bind that
# # entity to a SmartThings device (below) to drive a notification Routine.
# # drawer_full_pct = 90
# # litter_low_pct = 10

# Optional: enable Dyson sources (local MQTT push). Each [[dyson]] block is ONE
# device — repeat the block for multiple fans/purifiers. Omit them all to disable
# Dyson (no MQTT tasks spawned). This is a PUSH source: no poll interval — it
# emits observations as the device sends them.
# [[dyson]]
# host = "192.168.2.133"                 # the only REQUIRED key in this block
# port = 1883                            # optional; default 1883 (8883 = TLS)
# tls = false                            # optional; default false (set true for 8883)
# # From the device's setup sticker. Optional in the schema, but you need EITHER
# # ssid + wifi_password OR the explicit overrides below — `serial` and
# # `product_type` are parsed from the SSID, and the MQTT credential is derived
# # locally as base64(SHA-512(wifi_password)) — no Dyson cloud round-trip.
# ssid = "DYSON-XXX-XX-XXXXXXXX-XXX"
# wifi_password = "..."
# # Optional explicit overrides if the sticker SSID is unavailable. Any of these
# # takes precedence over the value derived from `ssid` / `wifi_password`:
# # serial = "..."
# # product_type = "438"                 # e.g. 438 = Pure Cool
# # credential = "..."                   # the already-derived MQTT password

# Optional: enable the local HTTP server. It is BOTH the JSON API and the
# fridge-dashboard UI. Omit this whole section to disable it (no listener is
# then started at all). Enabling it serves, on the LAN:
#   GET /                                  the dashboard page (HTML; NO auth)
#   GET /api/latest                        latest observation per entity, JSON
#   GET /api/history                       per-cat 10-day daily-median weights
#   GET /api/visits?cat=<slug>&days=<n>    one cat's visits (n capped at 60)
#   GET /assets/cats/<file>                cached cat photos from data/cats/ (NO auth)
#   GET /healthz                           liveness (NO auth)
# /api/history and /api/visits read [whisker].history_dir; they return empty
# when [whisker] is not configured or the archive is unreadable.
# [api]
# # Optional. Bind address; defaults to "0.0.0.0:8091" — ALL interfaces, since
# # hearth assumes a trusted LAN. Bind 127.0.0.1:8091 to keep it host-local.
# listen = "0.0.0.0:8091"
# # Optional bearer token. When set, the three /api/* routes require
# # `Authorization: Bearer <token>`. NOTE the display surfaces stay OPEN: `/`,
# # /assets/cats/*, and /healthz. The token is injected into the dashboard page
# # so its own polls authenticate — which means anyone who can reach the port can
# # read it out of the page source. This is LAN-grade auth, not access control:
# # if untrusted clients can reach the port, bind localhost and front it with an
# # authenticating reverse proxy.
# token = "generate-something-long-and-random"

# Optional: enable the SmartThings sink. Omit this whole section to just log.
# [smartthings]
# # Where refreshed OAuth tokens are persisted (default "token_store.json").
# # Holds a LIVE refresh token for your SmartThings account — treat it like a
# # password: it is gitignored, and hearth keeps it chmod 0600.
# token_store = "token_store.json"
# # Where `provision` saves the virtual devices it creates, as name -> device id
# # (default "device_store.json"). Delete it only if you also delete the devices
# # in SmartThings, or `provision` will create duplicates.
# device_store = "device_store.json"
# # base_url = "https://api.smartthings.com" # default
# #
# # Quick 24h smoke test: set a Personal Access Token and skip [smartthings.oauth].
# # access_token = "your-24h-personal-access-token"
#
# # Durable auth (recommended): register an app via `smartthings apps:create`,
# # then run `cargo run -- auth` once to authorize and store refreshable tokens.
# [smartthings.oauth]
# client_id = "your-client-id"
# client_secret = "your-client-secret"
# redirect_uri = "https://localhost/callback"
# scopes = ["r:devices:*", "w:devices:*", "x:devices:*"]
# # Optional endpoint overrides. Both default to SmartThings' own URLs (note the
# # token endpoint is on a DIFFERENT host); set them only to target another IdP
# # or a test double.
# # authorize_url = "https://api.smartthings.com/oauth/authorize"
# # token_url = "https://auth-global.api.smartthings.com/oauth/token"
#
# # Declare devices by name + the entities they carry, then run
# # `cargo run -- provision` to self-create them (ids saved to device_store.json).
# # Bind temperature-like classes (temperature / feels_like / dew_point) to
# # *separate* devices — they share SmartThings' single `temperature` attribute.
# [[smartthings.devices]]
# name = "Outdoor Weather"
# # device_id = "..."   # optional: use an existing device instead of provisioning
# # component = "main"  # optional: component to write events to (default "main")
# entities = [
#   "ambient_weather.outdoor.temperature",
#   "ambient_weather.outdoor.humidity",
# ]
#
# # Litter-box "time to change it" alert -> a virtual contactSensor (one per box,
# # so the notification can name the box). `needs_service` opens the contact when
# # the drawer is full / litter is low / the box is offline, and closes it when
# # cleared. After `provision`, build a Routine in the SmartThings app:
# #   IF  "Piano Room Litter" contact sensor is OPEN  THEN  Notify members
# # (Routines CAN send push notifications — that's the reliable ST alert path.)
# [[smartthings.devices]]
# name = "Piano Room Litter"
# entities = ["whisker.piano_room.needs_service"]
#
# # Read devices BACK from SmartThings (this makes it a *source*): e.g. a Wi-Fi
# # lock cloud-linked to your account. hearth polls each on the poll interval and
# # surfaces its lock/battery state onto the bus (visible via the [api] sink /
# # watch tile). No hub needed for Wi-Fi locks — just link the account in the app.
# [[smartthings.read]]
# device_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"   # the SmartThings device id
# node = "front_door"                                  # -> smartthings.front_door.lock / .battery
