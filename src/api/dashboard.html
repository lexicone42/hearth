<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearth — Home Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* Hearth Board — portrait multi-view home dashboard for the Samsung Family
     Hub fridge (probed: 720x1040 CSS px, portrait, Chromium 130). One page,
     tabbed views swapped client-side via #hash routes (no reloads). Committed
     single dark world; warm brown-black + brass; semantic good/warn/crit kept
     distinct from the brand accent. */
  :root {
    --bg:#1a1712; --bg-2:#241f19; --bg-3:#2d271f; --hair:#3a3228;
    --ink:#f2ece0; --muted:#a89f8f; --faint:#78705f;
    --brass:#cba24e; --good:#77c08a; --warn:#e7a93e; --crit:#dc6a4c; --cool:#7fb6e0;
    --pee:#78b2dc; --poop:#b07a3c;
    --ava:#e2875f; --teddy:#52b1a3; --helly:#a996db; --jame:#d6a63e;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; line-height: 1.3;
    padding: 16px 16px 28px;
    background: radial-gradient(680px 480px at 84% -8%, #241c14 0%, rgba(36,28,20,0) 62%), var(--bg);
  }
  .board { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; flex-direction: column; gap: 10px; }
  .hrow { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .mark { font-size: 25px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .mark b { color: var(--brass); }
  .clock { font-family: var(--mono); font-size: 28px; font-variant-numeric: tabular-nums; }
  .date { color: var(--muted); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
  .verdict { display: inline-flex; align-items: center; gap: 9px; padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; border: 1px solid transparent; }
  .verdict .dot { width: 9px; height: 9px; border-radius: 50%; }
  .verdict.ok { background: rgba(119,192,138,.12); border-color: rgba(119,192,138,.32); color: var(--good); }
  .verdict.ok .dot { background: var(--good); box-shadow: 0 0 10px var(--good); }
  .verdict.attn { background: rgba(231,169,62,.13); border-color: rgba(231,169,62,.34); color: var(--warn); }
  .verdict.attn .dot { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .updated { color: var(--faint); font-size: 11.5px; font-family: var(--mono); }

  /* nav */
  nav { display: flex; gap: 7px; flex-wrap: wrap; border-bottom: 1px solid var(--hair); padding-bottom: 12px; }
  .tab { appearance: none; border: 1px solid var(--hair); background: var(--bg-2); color: var(--muted);
    font: inherit; font-size: 14px; font-weight: 600; padding: 8px 15px; border-radius: 999px; cursor: pointer; text-decoration: none; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: #241b12; background: var(--brass); border-color: var(--brass); }
  .tab:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  section.view { display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; margin: 2px; }
  .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
  .eyebrow .count { color: var(--muted); letter-spacing: 0.06em; }
  .grp { display: flex; flex-direction: column; gap: 9px; }
  .card { background: linear-gradient(180deg, var(--bg-2), #201b15); border: 1px solid var(--hair); border-radius: 14px; padding: 14px; }

  /* litter */
  .boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .box { position: relative; overflow: hidden; }
  .box::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--good); }
  .box.warn::before { background: var(--warn); } .box.crit::before { background: var(--crit); }
  .box-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .box-name { font-size: 16px; font-weight: 650; }
  .pill { font-size: 11px; font-weight: 650; padding: 4px 9px; border-radius: 999px; align-self: flex-start; white-space: nowrap; }
  .pill.good { color: var(--good); background: rgba(119,192,138,.13); }
  .pill.warn { color: var(--warn); background: rgba(231,169,62,.14); }
  .pill.crit { color: #241b12; background: var(--crit); }
  .meter { margin-top: 10px; }
  .meter-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .meter-label { font-size: 11.5px; color: var(--muted); }
  .meter-val { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
  .track { height: 9px; border-radius: 6px; background: var(--bg-3); overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; transition: width .6s ease; }

  /* cats grid (overview) + cat detail */
  .cats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .cat { display: flex; flex-direction: column; gap: 8px; }
  .cat-head { display: flex; align-items: center; gap: 9px; }
  .chip { width: 12px; height: 12px; border-radius: 50%; }
  .cat-name { font-size: 17px; font-weight: 650; }
  .cat-weight { display: flex; align-items: baseline; gap: 6px; }
  .cat-weight .n { font-family: var(--mono); font-size: 36px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .cat-weight .u { color: var(--muted); font-size: 14px; }
  .spark { width: 100%; display: block; }
  .cat-foot { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
  .trend { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
  .trend.flat { color: var(--muted); } .trend.down { color: var(--warn); } .trend.up { color: var(--good); }
  .visits { color: var(--faint); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .cat-detail .spark { height: 88px; }
  .cat-detail { gap: 10px; }
  .minmax { display: flex; gap: 16px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .minmax b { color: var(--ink); font-weight: 600; }

  /* generic metric groups (weather / air) */
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .m { display: flex; flex-direction: column; gap: 3px; padding: 12px; }
  .m .lbl { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .m .v { font-family: var(--mono); font-size: 21px; font-variant-numeric: tabular-nums; }
  .m .v small { font-family: var(--ui); font-size: 12px; color: var(--muted); margin-left: 2px; }
  .m.cold .v { color: var(--cool); } .m.hot .v { color: var(--warn); }
  .grp-title { font-size: 15px; font-weight: 650; margin: 2px 2px -2px; display: flex; align-items: center; gap: 9px; }
  .grp-title .tag { font-size: 11px; font-weight: 600; color: var(--faint); font-family: var(--mono); }

  .empty { color: var(--muted); padding: 20px; text-align: center; }

  /* cat cards as the board's headline */
  .cat-hero { gap: 9px; }
  .cat-hero .cat-head { justify-content: flex-start; }
  .cat-hero .cat-name { font-size: 18px; }
  .cat-hero .cat-weight { align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .cat-hero .cat-weight .n { font-size: 32px; }
  .cat-hero .trend { font-size: 12px; }
  .sdot { width: 9px; height: 9px; border-radius: 50%; margin-left: auto; flex: none; background: var(--good); }
  .sdot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .sdot.crit { background: var(--crit); box-shadow: 0 0 9px var(--crit); }
  .cat-bits { display: flex; flex-direction: column; gap: 3px; }
  .bit { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; }
  .bit .k { width: 62px; color: var(--faint); flex: none; }
  .bit .v { color: var(--ink); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .bit .norm { color: var(--faint); }
  .bit.off .v { color: var(--warn); }
  /* AQI hero */
  .aqi { display: flex; flex-direction: column; gap: 12px; border-width: 1.5px; }
  .aqi-n { font-family: var(--mono); font-size: 54px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .aqi { position: relative; }
  .aqi-meta { display: flex; flex-direction: column; gap: 3px; }
  .aqi-cat { font-size: 17px; font-weight: 700; }
  .aqi-sub { font-size: 12px; color: var(--muted); }
  .aqi-sub em { color: var(--faint); font-style: normal; }
  .aqi-scale { position: relative; display: flex; gap: 2px; height: 8px; }
  .aqi-seg { flex: 1; border-radius: 3px; opacity: .5; }
  .aqi-mark { position: absolute; top: -3px; width: 3px; height: 14px; border-radius: 2px;
    background: var(--ink); box-shadow: 0 0 0 2px var(--bg-2); transform: translateX(-1.5px); }

  /* explore */
  .m.tappable { cursor: pointer; }
  .m.tappable:hover { border: 1px solid var(--hair); }
  .ex-search { width: 100%; box-sizing: border-box; background: var(--bg-3); color: var(--ink);
    border: 1px solid var(--hair); border-radius: 9px; padding: 9px 12px; font: inherit; font-size: 14px; }
  .ex-search::placeholder { color: var(--faint); }
  .ex-search:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  .ex-list { max-height: 240px; overflow-y: auto; margin-top: 10px;
    display: flex; flex-direction: column; gap: 3px; }
  .ex-src { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint); margin: 8px 2px 2px; }
  .ex-item { appearance: none; text-align: left; border: 1px solid transparent; background: var(--bg-3);
    color: var(--muted); font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .ex-item:hover { color: var(--ink); }
  .ex-item.on { background: var(--brass); color: #241b12; font-weight: 650; }
  .ex-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
  .ex-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
  .ex-table th { text-align: left; color: var(--faint); font-weight: 600; font-size: 11px;
    letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px 8px 0; }
  .ex-table td { padding: 4px 10px 4px 0; border-top: 1px solid var(--hair);
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ex-table td:last-child { color: var(--brass); }

  /* calendar heatmap */
  .mpick { display: flex; gap: 5px; margin-left: auto; }
  .mbtn { appearance: none; border: 1px solid var(--hair); background: var(--bg-2); color: var(--muted);
    font: inherit; font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; cursor: pointer; }
  .mbtn.on { background: var(--brass); border-color: var(--brass); color: #241b12; }
  .mbtn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-dow { text-align: center; font-size: 10.5px; color: var(--faint); letter-spacing: .08em; padding-bottom: 2px; }
  .cal-c { aspect-ratio: 1 / 1; border-radius: 7px; background: var(--bg-3);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
    color: var(--ink); border: 1.5px solid transparent; }
  .cal-c.none { background: transparent; border: 1.5px dashed var(--hair); color: transparent; }
  .cal-c.q { border-color: var(--warn); }          /* notably quiet */
  .cal-c.b { border-color: var(--good); }          /* notably busy */
  .cal-c.zero { color: var(--warn); font-weight: 700; }
  .cal-c.today { box-shadow: 0 0 0 2px var(--brass) inset; }
  .cal-key { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 11px; font-size: 11px; color: var(--faint); }
  .cal-key .ramp { width: 66px; height: 8px; border-radius: 4px; }
  .cal-key .k2 { margin-left: auto; }
  .m .sub { font-size: 11px; color: var(--faint); }
  .m.off { border: 1px solid rgba(231,169,62,.4); }
  .m.off .v { color: var(--warn); }

  /* scrubbable charts + the shared day readout */
  .chart { position: relative; touch-action: pan-y; cursor: crosshair; }
  .readout {
    display: flex; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
    padding: 11px 14px; background: var(--bg-2); border: 1px solid var(--hair);
    border-radius: 12px; font-family: var(--mono); font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .readout .ro-d { color: var(--brass); font-weight: 600; }
  .readout .ro-d em { color: var(--faint); font-style: normal; font-size: 12px; }
  .readout .ro-v small { color: var(--muted); font-size: 11.5px; margin-left: 1px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; }
  .lg i { width: 9px; height: 9px; border-radius: 2px; font-style: normal; }
  .brow { display: flex; align-items: center; gap: 10px; }
  .brow .bl { width: 104px; font-size: 13px; color: var(--muted); }
  .brow .bt { flex: 1; height: 14px; background: var(--bg-3); border-radius: 5px; overflow: hidden; display: flex; }
  .brow .bn { width: 62px; text-align: right; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  footer { display: flex; align-items: center; justify-content: space-between; color: var(--faint); font-size: 11.5px; padding-top: 2px; }
  .live { display: inline-flex; align-items: center; gap: 8px; }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .live .dot, .fill { animation: none; transition: none; } }
</style>
</head>
<body>

<div class="board">
  <header>
    <div class="hrow">
      <div class="mark">Hea<b>r</b>th</div>
      <div style="text-align:right"><div id="clock" class="clock">--:--</div><div id="date" class="date"></div></div>
    </div>
    <div class="hrow">
      <div id="verdict" class="verdict ok"><span class="dot"></span><span id="verdict-text">&mdash;</span></div>
      <div id="updated" class="updated">connecting&hellip;</div>
    </div>
    <nav id="nav"></nav>
  </header>
  <section id="view" class="view"></section>
  <footer><span class="live"><span class="dot"></span><span>hearth</span></span><span id="src">live</span></footer>
</div>

<script>
/* ------------------------------------------------------------------ *
 * Live wiring: hearth serves this file and injects the API token. The
 * page polls /api/latest (+ /api/history for sparklines), paints from
 * localStorage instantly, and REFETCHES ON WAKE. Views swap via #hash
 * (no reloads). Unreachable (e.g. claude.ai preview) -> embedded snapshot.
 * ------------------------------------------------------------------ */
var TOKEN = "__HEARTH_API_TOKEN__"; if (TOKEN.indexOf("__HEARTH") === 0) TOKEN = "";
var CAT_COLOR = { ava: "var(--ava)", teddy: "var(--teddy)", helly: "var(--helly)", jame: "var(--jame)" };
var TH = { drawerFull: 90, litterLow: 10, drawerWarn: 70, litterWarn: 25 };

/* friendly names for known nodes; anything else is prettified from its slug */
var NODE = {
  outdoor: "Outdoor", indoor: "Indoor", sensor_1: "Greenhouse", sensor_4: "Greenhouse · West",
  sensor_7: "Freezer", soil_3: "Greenhouse Soil", rain: "Rain", wind: "Wind", sun: "Sun",
  barometer: "Barometer"
};
var COLD = { Freezer: 1 }, HOT = { Greenhouse: 1, "Greenhouse · West": 1 };

/* embedded fallback, shaped exactly like /api/latest, so preview == live path */
var FALLBACK = { entities: [
  ent("whisker.ava.weight","Weight",7.5,"lb"), ent("whisker.helly.weight","Weight",9.5,"lb"),
  ent("whisker.teddy.weight","Weight",9.6,"lb"), ent("whisker.jame.weight","Weight",11.8,"lb"),
  box("piano_room",100,31,"Ready",false), box("bonus_room",98,49,"Ready",false), box("guest_room_5",77,25,"Ready",false),
  ent("ambient_weather.outdoor.temperature","Temperature",69.1,"°F"), ent("ambient_weather.outdoor.feels_like","ApparentTemperature",69.1,"°F"),
  ent("ambient_weather.outdoor.humidity","Humidity",72,"%"), ent("ambient_weather.outdoor.dew_point","DewPoint",59.7,"°F"),
  ent("ambient_weather.indoor.temperature","Temperature",67.8,"°F"), ent("ambient_weather.indoor.humidity","Humidity",70,"%"),
  ent("ambient_weather.sensor_7.temperature","Temperature",-3.8,"°F"), ent("ambient_weather.sensor_1.temperature","Temperature",76.3,"°F"),
  ent("ambient_weather.sensor_4.temperature","Temperature",80.1,"°F"), ent("ambient_weather.soil_3.moisture","SoilMoisture",2,"%"),
  ent("ambient_weather.rain.daily","PrecipitationAccumulation",0,"in"), ent("ambient_weather.rain.weekly","PrecipitationAccumulation",0,"in"),
  ent("ambient_weather.rain.monthly","PrecipitationAccumulation",0.2,"in"), ent("ambient_weather.rain.yearly","PrecipitationAccumulation",29.2,"in"),
  ent("ambient_weather.wind.speed","WindSpeed",4,"mph"), ent("ambient_weather.wind.gust","WindGust",9,"mph"), ent("ambient_weather.wind.bearing","WindBearing",159,"°"),
  ent("ambient_weather.sun.uv_index","UvIndex",7,""), ent("ambient_weather.sun.solar_radiation","SolarRadiation",741,"W/m²"),
  ent("ambient_weather.barometer.relative","Pressure",29.7,"inHg"),
  ent("dyson.living.pm25","Pm25",4,"µg/m³"), ent("dyson.living.pm10","Pm10",8,"µg/m³"), ent("dyson.living.voc","VolatileOrganicCompounds",35,""),
  ent("dyson.living.nitrogen_dioxide","NitrogenDioxide",4,""), ent("dyson.living.fan_speed","FanSpeed",3,""), ent("dyson.living.filter_life","FilterLife",89,"%"),
  ent("dyson.living.temperature","Temperature",70.2,"°F"), ent("dyson.living.humidity","Humidity",48,"%")
] };
/* Offline-preview history. `hoursAgo` keeps `last seen` sensible whenever the
   preview is opened, instead of drifting into "412d ago". */
function hoursAgo(h) { return new Date(Date.now() - h * 3600000).toISOString(); }
var FALLBACK_HIST = {
  ava: { series: [7.48,7.38,7.46,7.55,7.52,7.30,7.43,7.45,7.39,7.54], visits: 35,
    recent_avg: 7.48, last_seen: hoursAgo(1.5), h24: {visits:5,pee:2,poop:3}, per_day: {visits:4.2,pee:3.3,poop:0.8} },
  helly: { series: [9.49,9.47,9.52,9.49,9.50,9.47,9.44,9.46,9.52,9.49], visits: 82,
    recent_avg: 9.31, last_seen: hoursAgo(13), h24: {visits:2,pee:1,poop:1}, per_day: {visits:5.8,pee:4.7,poop:1.1} },
  teddy: { series: [9.80,9.86,9.78,9.83,9.80,9.74,9.74,9.73,9.64,9.61], visits: 26,
    recent_avg: 9.59, last_seen: hoursAgo(3), h24: {visits:5,pee:5,poop:0}, per_day: {visits:4.5,pee:4.0,poop:0.5} },
  jame: { series: [11.75,11.67,11.76,11.82,11.79,11.80,11.67,11.68,11.66,11.69], visits: 43,
    recent_avg: 11.42, last_seen: hoursAgo(0.5), h24: {visits:3,pee:3,poop:0}, per_day: {visits:4.2,pee:3.8,poop:0.4} }
};
function ent(id, cls, val, unit) { return { entity: id, class: cls, value: val, unit: unit, display: val + (unit ? " " + unit : "") }; }
function box(slug, litter, drawer, status, needs) { return [
  ent("whisker." + slug + ".litter_level","LitterLevel",litter,"%"),
  ent("whisker." + slug + ".waste_drawer","WasteDrawer",drawer,"%"),
  { entity: "whisker." + slug + ".status", class: "Status", value: status, display: status },
  { entity: "whisker." + slug + ".needs_service", class: "Alert", value: needs, display: String(needs) }
]; }
FALLBACK.entities = FALLBACK.entities.reduce(function (a, x) { return a.concat(x); }, []); // flatten box() arrays

/* ---------- helpers ---------- */
function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
function pretty(seg) { return seg.split("_").map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(" "); }
function num(x) { return x == null ? null : Number(x); }

/* ---------- normalize /api/latest into a model ---------- */
function model(snap, hist) {
  var ents = snap.entities || [], byId = {}, nodes = {};
  ents.forEach(function (e) {
    byId[e.entity] = e;
    var p = e.entity.split("."); if (p.length < 3) return;
    var src = p[0], node = p[1], chan = p.slice(2).join(".");
    (nodes[src] = nodes[src] || {}); (nodes[src][node] = nodes[src][node] || {})[chan] = e;
  });
  /* litter + cats from whisker nodes */
  var boxes = [], cats = [];
  Object.keys(nodes.whisker || {}).forEach(function (node) {
    var n = nodes.whisker[node];
    if (n.litter_level || n.waste_drawer) {
      boxes.push({ slug: node, name: pretty(node),
        litter: n.litter_level ? num(n.litter_level.value) : 100,
        drawer: n.waste_drawer ? num(n.waste_drawer.value) : 0,
        status: n.status ? String(n.status.value) : "Ready",
        needs: n.needs_service ? n.needs_service.value === true : false });
    } else if (n.weight) {
      var h = (hist && hist[node]) || {};
      cats.push({ slug: node, name: pretty(node),
        // The headline weight is the mean of the last THREE readings, not the
        // newest one: a single mis-weigh (two cats in the box, or one leaving
        // mid-weigh) shouldn't become the number on the fridge.

}

/* ---------- view definitions ---------- */
var VIEWS = [
  { id: "overview", label: "Overview", show: function () { return true; }, render: renderOverview },
  { id: "cats", label: "Cats", show: function (m) { return m.cats.length > 0; }, render: renderCats },
  { id: "gallery", label: "Gallery", show: function (m) { return m.cats.length > 0; }, render: renderGallery },
  { id: "weather", label: "Weather", show: function (m) { return !!m.nodes.ambient_weather; }, render: function (m, r) { renderMetrics(m, r, "ambient_weather"); } },

/* Slugs are always lowercase [a-z0-9_] (server-side slugify). Validating the

  if (p[0] === "explore") {

}
function paint(m) {

  var root = document.getElementById("view"); root.innerHTML = "";
  if (r.view === "cat") { renderCatDetail(r.slug, m, root); return; }
  if (r.view === "explore") { renderExplore(root, r.entity); return; }

}

/* ---------- OVERVIEW ---------- */
function renderOverview(m, root) {

/* ---------- CATS (detail) ---------- */

/* ---------- AIR: the EPA index as the headline ----------
   hearth computes a real US EPA AQI in Rust (24-hour mean, per the standard) and
   publishes it as `<node>.aqi`. The page's job is only to present it: the score,
   what that means for a person, and which pollutant set it — since the max
   sub-index IS the driver, that last part is the actionable half. */
var AQI_BANDS = [
  { max: 50,  label: "Good",                           color: "var(--good)" },
  { max: 100, label: "Moderate",                       color: "var(--warn)" },
  { max: 150, label: "Unhealthy for Sensitive Groups", color: "#e8843c" },
  { max: 200, label: "Unhealthy",                      color: "var(--crit)" },
  { max: 300, label: "Very Unhealthy",                 color: "#b05ce0" },
  { max: 1e9, label: "Hazardous",                      color: "#a13b3b" }

function aqiBand(v) {
  for (var i = 0; i < AQI_BANDS.length; i++) if (v <= AQI_BANDS[i].max) return AQI_BANDS[i];
  return AQI_BANDS[AQI_BANDS.length - 1];
}
/* EPA sub-index, mirrored from src/aqi.rs so the page can name the driver and
   show each pollutant's contribution. Kept deliberately small: the authoritative
   copy is the Rust one, which publishes the number this page displays. */
var AQI_BP = {
  pm25: [[0,9,0,50],[9.1,35.4,51,100],[35.5,55.4,101,150],[55.5,125.4,151,200],[125.5,225.4,201,300],[225.5,325.4,301,500]],
  pm10: [[0,54,0,50],[55,154,51,100],[155,254,101,150],[255,354,151,200],[355,424,201,300],[425,604,301,500]]

function subIndex(kind, conc) {
  if (typeof conc !== "number" || !isFinite(conc) || conc < 0) return null;
  var c = kind === "pm25" ? Math.floor(conc * 10) / 10 : Math.floor(conc);
  var bands = AQI_BP[kind];
  for (var i = 0; i < bands.length; i++) {
    var b = bands[i];
    if (c <= b[1]) { var cc = Math.max(c, b[0]);
      return Math.round((b[3] - b[2]) / (b[1] - b[0]) * (cc - b[0]) + b[2]); }
  }
  return 500;
}

function renderAir(m, root) {
  var group = m.nodes.dyson || {};
  var nodes = Object.keys(group).sort();
  if (!nodes.length) { root.appendChild(el("div", "empty", "No air data yet.")); return; }

  nodes.forEach(function (node) {
    var ch = group[node];
    var num = function (c) { return ch[c] ? Number(ch[c].value) : null; };
    var pm25 = num("pm25"), pm10 = num("pm10");
    // Prefer hearth's own computed index; fall back to a local estimate only if
    // the AQI task hasn't produced one yet (fresh install, no 24h of history).
    var published = ch[ "aqi" ] ? Math.round(Number(ch["aqi"].value)) : null;
    var i25 = subIndex("pm25", pm25), i10 = subIndex("pm10", pm10);
    var localMax = Math.max(i25 == null ? -1 : i25, i10 == null ? -1 : i10);
    var score = published != null ? published : (localMax >= 0 ? localMax : null);
    var driver = (i10 != null && i10 > (i25 == null ? -1 : i25)) ? "PM10" : (i25 != null ? "PM2.5" : null);

    var g = el("div", "grp");
    g.appendChild(el("div", "grp-title", esc(pretty(node)) +

      var band = aqiBand(score);
      var hero = el("div", "card aqi");

      hero.innerHTML =
        '<div class="aqi-n" style="color:' + band.color + '">' + score + '</div>' +
        '<div class="aqi-meta">' +
          '<div class="aqi-cat" style="color:' + band.color + '">' + esc(band.label) + '</div>' +
          '<div class="aqi-sub">US EPA Air Quality Index' +
            (driver ? ' · driven by <b>' + esc(driver) + '</b>' : '') +
            (published == null ? ' · <em>estimated from the latest reading</em>' : ' · 24-hour mean') +
          '</div>' +
        '</div>';
      // The scale, with a marker where this reading sits.

      AQI_BANDS.slice(0, 5).forEach(function (b) {
        var seg = el("div", "aqi-seg"); seg.style.background = b.color; seg.title = b.label;
        scale.appendChild(seg);
      });
      var mark = el("div", "aqi-mark");
      mark.style.left = Math.min(100, (score / 300) * 100) + "%";
      scale.appendChild(mark);
      hero.appendChild(scale);
      g.appendChild(hero);
    }

    // Pollutants, each with its own sub-index so you can see what's contributing.
    var card = el("div", "card"), grid = el("div", "metrics");
    [["pm25", "PM2.5", i25], ["pm10", "PM10", i10]].forEach(function (t) {
      var e = ch[t[0]]; if (!e) return;
      var mm = metric(t[1], e, "");
      if (t[2] != null) {

        mm.appendChild(sub);

    Object.keys(ch).sort().forEach(function (c) {
      if (c === "pm25" || c === "pm10" || c === "aqi") return;
      var e = ch[c];
      if (e.class === "BatteryLow" || e.class === "Timestamp") return;
      grid.appendChild(metric(pretty(c), e, ""));
    });
    card.appendChild(grid);
    g.appendChild(card);
    root.appendChild(g);
  });
  setVerdict(countAttention(m));
}

/* ---------- METRICS (weather / air) — group by node, show all channels ---------- */
function renderMetrics(m, root, src) {
  var group = m.nodes[src] || {};
  var order = Object.keys(group).sort(function (a, b) {
    return (NODE[a] || pretty(a)) < (NODE[b] || pretty(b)) ? -1 : 1;
  });
  if (!order.length) { root.appendChild(el("div", "empty", "No data yet.")); return; }
  order.forEach(function (node) {

    var mg = el("div", "card"); var grid = el("div", "metrics");

/* ---------- shared bits ---------- */
function sevBox(b) {
  if (b.drawer >= TH.drawerFull || b.litter <= TH.litterLow || b.needs) return "crit";
  if (b.drawer >= TH.drawerWarn || b.litter <= TH.litterWarn) return "warn";
  return "good";
}
function countAttention(m) { var n = 0; m.boxes.forEach(function (b) { if (sevBox(b) !== "good") n++; }); return n; }
function setVerdict(attention) {
  var v = document.getElementById("verdict"), vt = document.getElementById("verdict-text");
  if (attention === 0) { v.className = "verdict ok"; vt.textContent = "All clear"; }
  else { v.className = "verdict attn"; vt.textContent = attention + (attention === 1 ? " box needs you" : " boxes need you"); }
}
function meter(lbl, val, color) {
  var m = el("div", "meter");
  m.appendChild(el("div", "meter-top", '<span class="meter-label">' + lbl + '</span><span class="meter-val">' + Math.round(val) + '%</span>'));
  var track = el("div", "track"), fill = el("div", "fill");
  fill.style.width = Math.max(2, Math.min(100, val)) + "%"; fill.style.background = color;
  track.appendChild(fill); m.appendChild(track); return m;
}
function metric(lbl, e, cls) {
  var card = el("div", "m " + (cls || ""));
  card.appendChild(el("div", "lbl", lbl));
  var val = e.unit
    ? '<span>' + esc(fmtNum(e.value)) + '</span><small>' + esc(e.unit) + '</small>'
    : esc(String(e.value));
  card.appendChild(el("div", "v", val));
  // Any recorded signal can be charted — tapping a reading opens its history.
  if (e.entity && ENTITY_RE.test(e.entity)) {
    card.classList.add("tappable");
    card.setAttribute("role", "link");
    card.setAttribute("tabindex", "0");
    var go = function () { location.hash = "#/explore/" + e.entity; };
    card.addEventListener("click", go);
    card.addEventListener("keydown", function (ev) { if (ev.key === "Enter") go(); });
  }
  return card;
}
function fmtNum(v) { var n = Number(v); return isNaN(n) ? String(v) : (Math.abs(n) >= 100 ? Math.round(n) : n.toFixed(1)); }
/* How long ago, in words. `null` when we've never seen the cat. */
function ago(iso) {
  if (!iso) return null;
  var t = Date.parse(iso);
  if (isNaN(t)) return null;
  var mins = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (mins < 60) return mins <= 1 ? "just now" : mins + "m ago";
  var hrs = Math.round(mins / 60);
  if (hrs < 48) return hrs + "h ago";
  return Math.round(hrs / 24) + "d ago";
}

/* Is anything about this cat worth a second look?
   Three things actually matter, in order: have we seen them at all recently,
   are they using the box as often as usual, and have they stopped pooping.
   Everything else is noise on a fridge. Returns {level, why}. */
function catFlags(c) {
  var out = { level: "good", why: [] };
  var mins = c.lastSeen ? (Date.now() - Date.parse(c.lastSeen)) / 60000 : null;
  function bump(lvl) {
    if (lvl === "crit" || out.level === "good") out.level = lvl;
    if (lvl === "crit") out.level = "crit";
  }
  if (mins != null && !isNaN(mins)) {
    if (mins > 24 * 60) { bump("crit"); out.why.push("not seen in over a day"); }
    else if (mins > 12 * 60) { bump("warn"); out.why.push("not seen in " + Math.round(mins / 60) + "h"); }
  }
  if (c.h24 && c.perDay && c.perDay.visits >= 2 && c.h24.visits < c.perDay.visits * 0.5) {
    bump("warn"); out.why.push("using the box about half as often as usual");
  }
  if (c.h24 && c.perDay && c.perDay.poop >= 1 && c.h24.poop === 0) {
    bump("warn"); out.why.push("no poop in 24h (usually " + c.perDay.poop.toFixed(1) + "/day)");
  }
  return out;
}

function catCard(c, sparkH, detail) {
  var color = CAT_COLOR[c.slug] || "var(--brass)";
  var s = c.series && c.series.length > 1 ? c.series : [c.weight, c.weight];
  var delta = s[s.length - 1] - s[0];
  var dir = Math.abs(delta) < 0.12 ? "flat" : (delta < 0 ? "down" : "up");
  var arrow = dir === "flat" ? "steady" : ((dir === "down" ? "▼ " : "▲ ") + Math.abs(delta).toFixed(2) + " lb");
  var flags = catFlags(c);

  var card = el("div", "card cat cat-hero");
  var head = catHead(c.slug, c.name, color, 40);
  var dot = el("span", "sdot " + flags.level);
  dot.title = flags.why.length ? flags.why.join("; ") : "nothing unusual";
  head.appendChild(dot);
  card.appendChild(head);

  card.appendChild(el("div", "cat-weight",
    '<span class="n">' + Number(c.weight).toFixed(2) + '</span><span class="u">lb</span>' +
    '<span class="trend ' + dir + '">' + arrow + '</span>'));
  card.appendChild(sparkline(s, color, sparkH));

  /* The two lines that actually catch a problem. */
  var seen = ago(c.lastSeen);
  var bits = el("div", "cat-bits");
  if (seen) {
    var late = flags.why.length && /not seen/.test(flags.why[0]);
    bits.appendChild(el("div", "bit" + (late ? " off" : ""),
      '<span class="k">last seen</span><span class="v">' + esc(seen) + '</span>'));
  }
  if (c.h24 && c.perDay) {
    var norm = c.perDay.visits >= 0.5 ? ' <span class="norm">of ~' + Math.round(c.perDay.visits) + '</span>' : '';
    bits.appendChild(el("div", "bit",
      '<span class="k">today</span><span class="v">' + Math.round(c.h24.visits) + ' visits' + norm + '</span>'));
    bits.appendChild(el("div", "bit",
      '<span class="k"></span><span class="v">' +
      '<b style="color:var(--pee)">' + Math.round(c.h24.pee) + '</b> pee · ' +
      '<b style="color:var(--poop)">' + Math.round(c.h24.poop) + '</b> poop</span>'));
  }
  card.appendChild(bits);
  card.appendChild(el("div", "cat-foot", '<span class="visits">' + (c.visits || 0) + ' visits / 10d</span><span class="visits">details ›</span>'));
  linkToCat(card, c.slug);
  return card;
}
/* make a cat card tap through to its detail page */
function linkToCat(card, slug) {
  card.style.cursor = "pointer";
  card.setAttribute("role", "link");
  card.setAttribute("tabindex", "0");
  card.addEventListener("click", function () { location.hash = "#/cat/" + slug; });
  card.addEventListener("keydown", function (e) { if (e.key === "Enter") location.hash = "#/cat/" + slug; });
}
function sparkline(series, color, H) {
  var W = 300, pad = 4;
  var min = Math.min.apply(null, series), max = Math.max.apply(null, series), rng = (max - min) || 1;
  var sx = (W - pad * 2) / (series.length - 1);
  var pts = series.map(function (v, i) { return [pad + i * sx, pad + (1 - (v - min) / rng) * (H - pad * 2)]; });
  var line = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  var area = line + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (H - pad) + " L" + pts[0][0].toFixed(1) + " " + (H - pad) + " Z";
  var e = pts[pts.length - 1], id = "g" + Math.round(e[1] * 100) + series.length + Math.round(H);
  var svg = '<svg class="spark" style="height:' + H + 'px" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity="0.28"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#' + id + ')"/><path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + e[0].toFixed(1) + '" cy="' + e[1].toFixed(1) + '" r="3.2" fill="' + color + '"/></svg>';
  var d = el("div"); d.innerHTML = svg; return d.firstChild;
}

/* ---------- cat photos (served same-origin from hearth; initial-circle fallback) ---------- */
function avatar(slug, name, color, size) {
  var wrap = el("div");
  wrap.style.cssText = "width:" + size + "px;height:" + size + "px;border-radius:50%;overflow:hidden;flex:none;background:" + color + ";display:flex;align-items:center;justify-content:center;";
  var img = document.createElement("img");
  img.alt = name; img.src = "/assets/cats/" + slug + ".webp";
  img.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;";
  img.onerror = function () {

/* ---------- per-cat DETAIL view (#/cat/<slug>) ---------- */

    { slug: slug, name: pretty(slug), weight: 0, series: null, visits: 0 };

function titleCase(s) { return String(s).split(" ").map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(" "); }

function drawCatCharts(cat, color, visits, root) {
  if (!visits.length) { root.appendChild(el("div", "empty", "No visits recorded yet.")); return; }

  /* ---- bucket per calendar day, FILLING empty days: a zero-visit day is real
     signal for frequency, so a gap must never be silently skipped. ---- */
  var byDay = {};
  visits.forEach(function (v) {
    var iso = String(v.ts).slice(0, 10);
    var e = byDay[iso] || (byDay[iso] = { iso: iso, w: [], dur: [], out: [], pee: 0, poop: 0, n: 0 });
    if (typeof v.weight === "number") e.w.push(v.weight);
    if (typeof v.duration === "number" && v.duration > 0) e.dur.push(v.duration);
    if (typeof v.waste_weight === "number" && v.waste_weight > 0) e.out.push(v.waste_weight);
    e.n++;
    if (v.waste === "Urine") e.pee++; else if (v.waste === "Feces") e.poop++;

    d.durMed = med(d.dur);

  var full = (partial && days.length > 1) ? days.slice(0, days.length - 1) : days;
  var peeAvg = avg(full.map(function (d) { return d.pee; }));
  var poopAvg = avg(full.map(function (d) { return d.poop; }));
  var durAvg = avg(full.map(function (d) { return d.durMed; }).filter(function (x) { return x != null; }));

  /* ---- summary ---- */

  days.forEach(function (d) { totPee += d.pee; totPoop += d.poop; allW = allW.concat(d.w); allOut = allOut.concat(d.out); });
  var wLo = allW.length ? Math.min.apply(null, allW) : 0, wHi = allW.length ? Math.max.apply(null, allW) : 0;
  /* ---- Last 24 hours, against this cat's own normal ---- */

  var sum = el("div", "minmax");
  sum.innerHTML =
    '<span>range <b>' + wLo.toFixed(1) + '–' + wHi.toFixed(1) + ' lb</b></span>' +
    '<span><b>' + visits.length + '</b> visits / ' + days.length + 'd</span>' +
    '<span><b>' + totPee + '</b> pees · <b>' + totPoop + '</b> poops</span>' +
    (allOut.length ? '<span>output <b>' + Math.round(med(allOut)) + ' g</b></span>' : '');
  root.appendChild(wrapCard(sum));

  /* ---- shared day cursor: one drag moves every chart together ---- */
  var readout = el("div", "readout"); root.appendChild(readout);
  var charts = [];
  function show(i) {
    if (i == null || i < 0) i = days.length - 1;

    charts.forEach(function (c) { c.setCursor(i); });
    var d = days[i], last = (i === days.length - 1);
    readout.innerHTML =
      '<span class="ro-d">' + esc(fmtDay(d.iso)) + (last && partial ? ' <em>so far</em>' : '') + '</span>' +
      '<span class="ro-v">' + (d.med == null ? '—' : d.med.toFixed(2) + ' <small>lb</small>') + '</span>' +
      '<span class="ro-v" style="color:var(--pee)">' + d.pee + ' <small>pee</small></span>' +
      '<span class="ro-v" style="color:var(--poop)">' + d.poop + ' <small>poop</small></span>' +
      '<span class="ro-v">' + (d.durMed == null ? '—' : esc(fmtDur(d.durMed))) + ' <small>in box</small></span>';
  }

  function addChart(title, opts, caption) {
    var c = dayChart(days, opts, partial);

  }

  addChart("Weight — median & daily range", { value: function (d) { return d.med; }, band: true, color: color },
    'drag anywhere on a chart to read any day');
  addChart("Pee per day", { value: function (d) { return d.pee; }, zero: true, mean: peeAvg, color: "var(--pee)", height: 72 },
    'normally <b>' + peeAvg.toFixed(1) + '</b>/day <span style="color:var(--faint)">— dashed line</span>');
  addChart("Poop per day", { value: function (d) { return d.poop; }, zero: true, mean: poopAvg, color: "var(--poop)", height: 72 },
    'normally <b>' + poopAvg.toFixed(1) + '</b>/day <span style="color:var(--faint)">— dashed line</span>');
  if (durAvg > 0) {

  var bx = {};
  visits.forEach(function (v) {
    var b = bx[v.box_name] || (bx[v.box_name] = { label: titleCase(v.box_name), pee: 0, poop: 0, total: 0 });
    b.total++;

  var boxes = Object.keys(bx).map(function (k) { return bx[k]; }).sort(function (a, b) { return b.total - a.total; });
  root.appendChild(chartSection("Which box, for what", splitBars(boxes),
    '<span class="lg"><i style="background:var(--pee)"></i>pee</span><span class="lg"><i style="background:var(--poop)"></i>poop</span>'));

  show(null);   /* start on the most recent day */
}

/* Fill every calendar day between the first and last seen, so a day with no
   visits plots as a real zero instead of vanishing. */
function fillGaps(byDay) {
  var keys = Object.keys(byDay).sort();
  if (!keys.length) return [];

  while (cur <= end && guard++ < 400) {

    out.push(byDay[iso] || { iso: iso, w: [], dur: [], out: [], pee: 0, poop: 0, n: 0 });
    cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);

/* Parse/format YYYY-MM-DD in LOCAL time — `new Date("2026-07-26")` is UTC

function parseDay(iso) { var p = iso.split("-"); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
function isoDay(dt) {

}
function fmtDay(iso) { return parseDay(iso).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
function fmtDur(s) { s = Math.round(s); return s >= 60 ? (Math.floor(s / 60) + "m " + (s % 60) + "s") : (s + "s"); }
function med(xs) { if (!xs || !xs.length) return null; var v = xs.slice().sort(function (a, b) { return a - b; }); return v[Math.floor(v.length / 2)]; }
function avg(xs) { if (!xs || !xs.length) return 0; var t = 0; xs.forEach(function (x) { t += x; }); return t / xs.length; }

/* One day-indexed chart: optional min/max band, optional dashed "normal" mean,
   plus a cursor line+dot moved by setCursor() (attribute updates only, so
   dragging stays smooth on the fridge's SoC). */
function dayChart(days, o, partial) {
  var W = 300, H = o.height || 96, pad = 8, n = days.length;
  var vals = [], los = [], his = [];
  days.forEach(function (d) {
    var v = o.value(d); if (v != null) vals.push(v);
    if (o.band && d.lo != null) { los.push(d.lo); his.push(d.hi); }
  });
  var lo, hi;
  if (o.zero) { lo = 0; hi = Math.max.apply(null, vals.concat([o.mean || 0, 1])) * 1.18; }
  else {
    var src = o.band && los.length ? los : vals, srcHi = o.band && his.length ? his : vals;
    lo = vals.length ? Math.min.apply(null, src) : 0; hi = vals.length ? Math.max.apply(null, srcHi) : 1;
    var p = (hi - lo) * 0.12 || 0.2; lo -= p; hi += p;
  }
  var rng = (hi - lo) || 1;
  function X(i) { return n > 1 ? pad + i * (W - pad * 2) / (n - 1) : W / 2; }
  function Y(v) { return pad + (1 - (v - lo) / rng) * (H - pad * 2); }

  /* min–max band, drawn per run of consecutive days that have data */

        var top = run.map(function (r, k) { return (k ? "L" : "M") + X(r.i).toFixed(1) + " " + Y(r.hi).toFixed(1); }).join(" ");
        var bot = run.slice().reverse().map(function (r) { return "L" + X(r.i).toFixed(1) + " " + Y(r.lo).toFixed(1); }).join(" ");
        band += top + " " + bot + " Z ";

    flush();

    (band ? '<path d="' + band + '" fill="' + o.color + '" fill-opacity="0.16"/>' : "") +
    (meanY != null ? '<line x1="' + pad + '" y1="' + meanY + '" x2="' + (W - pad) + '" y2="' + meanY + '" stroke="' + o.color + '" stroke-opacity=".5" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/>' : "") +

    '<path d="' + line.trim() + '" fill="none" stroke="' + o.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<line class="cur-l" x1="0" y1="' + pad + '" x2="0" y2="' + (H - pad) + '" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>' +
    '<circle class="cur-d" r="3.6" fill="var(--ink)" style="display:none"/>';

  var box = el("div", "chart");
  box.innerHTML = '<svg style="width:100%;height:' + H + 'px;display:block" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + inner + '</svg>';
  var cl = box.querySelector(".cur-l"), cd = box.querySelector(".cur-d");
  return {
    node: box,
    setCursor: function (i) {

      var v = o.value(days[i]);

/* Drag/tap anywhere on a chart to pick a day. Maps clientX through the element's
   own rect, so it stays correct despite the non-uniform viewBox scaling.
   `touch-action: pan-y` keeps vertical page scrolling working on the panel. */
function scrub(node, n, onIndex) {
  var down = false;
  function idx(clientX) {
    var r = node.getBoundingClientRect();
    if (!r.width) return 0;
    var f = (clientX - r.left) / r.width;
    f = f < 0 ? 0 : (f > 1 ? 1 : f);
    return Math.round(f * (n - 1));
  }
  node.addEventListener("pointerdown", function (e) {
    down = true;
    if (node.setPointerCapture) { try { node.setPointerCapture(e.pointerId); } catch (err) {} }
    onIndex(idx(e.clientX));
  });
  node.addEventListener("pointermove", function (e) {

  });
  node.addEventListener("pointerup", function () { down = false; });
  node.addEventListener("pointercancel", function () { down = false; });

/* ---------- day-by-day calendar heatmap ----------
   Two visual channels, so a month reads at a glance:
     BRIGHTNESS = how much happened that day (volume),
     OUTLINE    = how far that is from this cat's own normal (the variance) —
                  amber for notably quiet, the cat's colour for notably busy.
   Normal is the mean/σ over COMPLETE days, so a day in progress can't quietly
   redefine it. Days before the archive starts are dashed and empty, which keeps
   "no data" visually distinct from "a genuinely quiet day" — the distinction
   that matters most when you're scanning for a problem. */
var CAL_METRICS = [
  { id: "visits", label: "Visits", get: function (d) { return d.n; }, fmt: function (v) { return String(Math.round(v)); } },
  { id: "pee",    label: "Pee",    get: function (d) { return d.pee; }, fmt: function (v) { return String(Math.round(v)); } },
  { id: "poop",   label: "Poop",   get: function (d) { return d.poop; }, fmt: function (v) { return String(Math.round(v)); } },
  { id: "weight", label: "Weight", get: function (d) { return d.med; }, fmt: function (v) { return v == null ? "—" : v.toFixed(2); } }
];
var calMetric = "visits";

function calendarSection(days, color, partial, showDay) {
  var g = el("div", "grp");
  var head = el("div", "grp-title", "Day by day");
  var picker = el("div", "mpick");
  CAL_METRICS.forEach(function (mt) {
    var b = el("button", "mbtn" + (mt.id === calMetric ? " on" : ""), esc(mt.label));
    b.type = "button";
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      calMetric = mt.id;
      var fresh = calendarSection(days, color, partial, showDay);
      g.parentNode.replaceChild(fresh, g);
    });
    picker.appendChild(b);
  });
  head.appendChild(picker);
  g.appendChild(head);

  var mt = CAL_METRICS.filter(function (x) { return x.id === calMetric; })[0] || CAL_METRICS[0];
  var byIso = {}; days.forEach(function (d, i) { byIso[d.iso] = { d: d, i: i }; });

  // Baseline over complete days only.
  var base = (partial && days.length > 1 ? days.slice(0, days.length - 1) : days)
    .map(mt.get).filter(function (v) { return v != null; });
  var mu = avg(base);
  var sd = base.length > 1
    ? Math.sqrt(base.reduce(function (a, v) { return a + (v - mu) * (v - mu); }, 0) / base.length) : 0;
  var vals = days.map(mt.get).filter(function (v) { return v != null; });
  var lo = vals.length ? Math.min.apply(null, vals) : 0;
  var hi = vals.length ? Math.max.apply(null, vals) : 1;

  // Whole weeks (Mon-start) spanning the archived range.
  var first = parseDay(days[0].iso), last = parseDay(days[days.length - 1].iso);
  var start = new Date(first); start.setDate(start.getDate() - ((first.getDay() + 6) % 7));
  var end = new Date(last); end.setDate(end.getDate() + (6 - ((last.getDay() + 6) % 7)));

  var card = el("div", "card");
  var grid = el("div", "cal");
  ["M","T","W","T","F","S","S"].forEach(function (d) { grid.appendChild(el("div", "cal-dow", d)); });

  var weeks = [], cur = new Date(start), guard = 0;
  while (cur <= end && guard++ < 400) {
    var iso = isoDay(cur), hit = byIso[iso], cell = el("div", "cal-c");
    if (!hit) {
      cell.className = "cal-c none";
      cell.title = fmtDay(iso) + " — no data";
    } else {
      var v = mt.get(hit.d);
      if (v == null) {
        cell.className = "cal-c none";
        cell.title = fmtDay(iso) + " — no reading";
      } else {
        var z = sd > 0 ? (v - mu) / sd : 0;
        var frac = hi > lo ? (v - lo) / (hi - lo) : 0.5;
        cell.style.background = "color-mix(in srgb, " + color + " " + Math.round(12 + frac * 78) + "%, transparent)";
        if (z <= -1) { cell.classList.add("q"); }        // notably quiet
        else if (z >= 1.5) { cell.classList.add("b"); }  // notably busy
        if (mt.id !== "weight" && v === 0) cell.classList.add("zero");
        cell.textContent = mt.fmt(v);
        cell.title = fmtDay(iso) + " — " + mt.label.toLowerCase() + " " + mt.fmt(v) +
          (sd > 0 ? " (" + (z >= 0 ? "+" : "") + z.toFixed(1) + "σ vs normal)" : "");
        // Tapping a day drives the same cursor the charts use.
        (function (idx) {
          cell.style.cursor = "pointer";
          cell.addEventListener("click", function (e) { e.stopPropagation(); showDay(idx); });
        })(hit.i);
      }
      if (partial && hit.i === days.length - 1) cell.classList.add("today");
    }
    grid.appendChild(cell);

    cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
  }
  card.appendChild(grid);
  card.appendChild(el("div", "cal-key",
    '<span class="k1">quieter than usual</span>' +
    '<span class="ramp" style="background:linear-gradient(90deg, color-mix(in srgb,' + color + ' 12%,transparent), ' + color + ')"></span>' +
    '<span class="k1">busier</span>' +
    '<span class="k2">outline = ±1σ from normal · dashed = no data</span>'));
  g.appendChild(card);

  // ---- week over week ----
  var wk = [];
  for (var i = 0; i < weeks.length; i += 7) {
    var slice = weeks.slice(i, i + 7).filter(function (x) { return x.hit && mt.get(x.hit.d) != null; });
    if (!slice.length) continue;
    wk.push({ label: fmtDay(weeks[i].iso), mean: avg(slice.map(function (x) { return mt.get(x.hit.d); })), n: slice.length });
  }
  if (wk.length > 1) {
    var g2 = el("div", "grp");
    g2.appendChild(el("div", "grp-title", "Week over week"));
    var c2 = el("div", "card"), rows = el("div", "grp"); rows.style.gap = "8px";
    var wmax = Math.max.apply(null, wk.map(function (w) { return w.mean; })) || 1;
    wk.forEach(function (w, i) {
      var prev = i ? wk[i - 1].mean : null;
      var pct = prev ? ((w.mean - prev) / prev) * 100 : null;
      var dirc = pct == null ? "flat" : (Math.abs(pct) < 8 ? "flat" : (pct < 0 ? "down" : "up"));
      var row = el("div", "brow");
      var lbl = el("div", "bl"); lbl.textContent = "wk of " + w.label;
      var track = el("div", "bt");
      var fill = el("div");
      fill.style.cssText = "height:100%;width:" + Math.max(3, (w.mean / wmax) * 100) + "%;background:" + color + ";opacity:.85;";
      track.appendChild(fill);
      var val = el("div", "bn");
      val.innerHTML = '<span>' + w.mean.toFixed(1) + '</span>' +
        (pct == null ? '' : ' <span class="trend ' + dirc + '">' + (dirc === "flat" ? "~" : (pct < 0 ? "▼" : "▲")) + Math.abs(pct).toFixed(0) + '%</span>');
      val.style.width = "104px";
      row.appendChild(lbl); row.appendChild(track); row.appendChild(val);
      rows.appendChild(row);
    });
    c2.appendChild(rows);
    c2.appendChild(el("div", "minmax", '<span>per-day average of ' + esc(mt.label.toLowerCase()) + ', by week</span>'));
    g2.appendChild(c2);
    g.appendChild(g2);
  }
  return g;
}

/* The "is anything off right now?" panel: the last 24 hours of real visits,
   each figure shown against this cat's own normal day. The baseline excludes
   today, so a morning with few visits doesn't quietly redefine "normal". */
function last24(days, visits, partial, cat) {
  var since = Date.now() - 86400000;
  var recent = visits.filter(function (v) {
    var t = Date.parse(v.ts); return !isNaN(t) && t >= since;
  });
  var pee = recent.filter(function (v) { return v.waste === "Urine"; }).length;
  var poop = recent.filter(function (v) { return v.waste === "Feces"; }).length;
  var durs = recent.map(function (v) { return v.duration; }).filter(function (d) { return typeof d === "number" && d > 0; });
  var ws = recent.map(function (v) { return v.weight; }).filter(function (w) { return typeof w === "number"; });

  // Normal = mean per complete day (today excluded).
  var base = partial && days.length > 1 ? days.slice(0, days.length - 1) : days;
  var nVisits = avg(base.map(function (d) { return d.n; }));
  var nPee = avg(base.map(function (d) { return d.pee; }));
  var nPoop = avg(base.map(function (d) { return d.poop; }));
  var nDur = avg(base.map(function (d) { return d.durMed; }).filter(function (x) { return x != null; }));

  var last = recent.length ? recent[recent.length - 1] : (visits.length ? visits[visits.length - 1] : null);
  var seen = last ? ago(last.ts) : null;

  var g = el("div", "grp");
  g.appendChild(el("div", "grp-title", "Last 24 hours" +
    (seen ? '<span class="tag">last seen ' + esc(seen) + '</span>' : '')));
  var card = el("div", "card");
  var grid = el("div", "metrics");

  function stat(label, value, normal, off) {
    var m = el("div", "m" + (off ? " off" : ""));
    m.appendChild(el("div", "lbl", label));
    m.appendChild(el("div", "v", value));
    m.appendChild(el("div", "sub", normal));
    return m;
  }
  grid.appendChild(stat("Visits", String(recent.length),
    nVisits ? "usually ~" + nVisits.toFixed(1) : "",
    nVisits >= 2 && recent.length < nVisits * 0.5));
  grid.appendChild(stat("Pee", '<span style="color:var(--pee)">' + pee + '</span>',
    nPee ? "usually ~" + nPee.toFixed(1) : "", false));
  grid.appendChild(stat("Poop", '<span style="color:var(--poop)">' + poop + '</span>',
    nPoop ? "usually ~" + nPoop.toFixed(1) : "",
    nPoop >= 1 && poop === 0));
  grid.appendChild(stat("Weight", ws.length ? med(ws).toFixed(2) + '<small>lb</small>' : "—",
    ws.length ? ws.length + " reading" + (ws.length === 1 ? "" : "s") : "no readings", false));
  grid.appendChild(stat("In box", durs.length ? esc(fmtDur(med(durs))) : "—",
    nDur ? "usually " + fmtDur(nDur) : "", false));
  var boxes = {};
  recent.forEach(function (v) { boxes[v.box_name] = (boxes[v.box_name] || 0) + 1; });
  var top = Object.keys(boxes).sort(function (a, b) { return boxes[b] - boxes[a]; })[0];
  grid.appendChild(stat("Box", top ? esc(titleCase(top)) : "—",
    top ? boxes[top] + " of " + recent.length + " visits" : "", false));

  card.appendChild(grid);
  if (!recent.length) {
    card.appendChild(el("div", "minmax",
      '<span style="color:var(--warn)">No visits recorded in the last 24 hours.</span>'));
  }
  g.appendChild(card);
  return g;
}

function chartSection(title, node, caption) {
  var g = el("div", "grp");
  g.appendChild(el("div", "grp-title", title));
  var card = el("div", "card"); card.appendChild(node);
  if (caption) card.appendChild(el("div", "minmax", caption));
  g.appendChild(card); return g;
}
function wrapCard(node) { var c = el("div", "card"); c.appendChild(node); return c; }

/* Box preference, each bar split pee vs poop — shows whether a cat picks a
   different box depending on what it's there to do. */
function splitBars(rows) {
  var max = Math.max.apply(null, rows.map(function (r) { return r.total; })) || 1;
  var wrap = el("div", "grp"); wrap.style.gap = "10px";
  rows.forEach(function (r) {
    var row = el("div", "brow");
    var lbl = el("div", "bl"); lbl.textContent = r.label;
    var track = el("div", "bt");
    var p = el("div"); p.style.cssText = "height:100%;background:var(--pee);width:" + (r.pee / max * 100) + "%;";
    var q = el("div"); q.style.cssText = "height:100%;background:var(--poop);width:" + (r.poop / max * 100) + "%;";
    track.appendChild(p); track.appendChild(q);
    var val = el("div", "bn");
    val.innerHTML = '<span style="color:var(--pee)">' + r.pee + '</span> / <span style="color:var(--poop)">' + r.poop + '</span>';
    row.appendChild(lbl); row.appendChild(track); row.appendChild(val);
    wrap.appendChild(row);
  });
  return wrap;
}
/* preview-only: synthesize ~30 days of plausible visits when /api/visits is
   unreachable (e.g. viewing this file outside the LAN). Live data replaces it. */
function synthVisits(cat) {
  var base = cat.weight || 9, out = [], boxes = ["piano room", "bonus room", "guest room 5"];
  var fav = Math.floor(Math.random() * 3), today = new Date();
  for (var back = 29; back >= 0; back--) {
    var dt = new Date(today.getFullYear(), today.getMonth(), today.getDate() - back);
    var iso = isoDay(dt);
    var drift = base + (29 - back) * ((Math.random() - 0.45) * 0.006);
    var pees = 3 + Math.floor(Math.random() * 4), poops = Math.random() < 0.75 ? 1 : 2;
    for (var k = 0; k < pees + poops; k++) {
      var isPee = k < pees, hh = (6 + k * 2) % 24;
      out.push({
        ts: iso + "T" + (hh < 10 ? "0" : "") + hh + ":00:00Z",
        box_name: boxes[Math.random() < 0.55 ? fav : Math.floor(Math.random() * 3)],
        weight: drift + (Math.random() - 0.5) * 0.18,
        waste: isPee ? "Urine" : "Feces",
        duration: (isPee ? 45 : 70) + Math.floor(Math.random() * 35),
        waste_weight: (isPee ? 30 : 55) + Math.floor(Math.random() * 20)
      });
    }
  }
  return out;
}

/* ================= EXPLORE: every recorded signal, browsable =================
   The dashboard's other views are opinionated — they decide what matters. This
   one doesn't: it lists whatever the history happens to contain and lets you
   look. Charting is Canvas rather than SVG because a wide window can hold
   thousands of points, and a fridge SoC should not be asked to lay out
   thousands of DOM nodes. */
var EX = { entities: null, range: 24, entity: null, series: null, raw: false, busy: false };
var EX_RANGES = [
  { h: 1, label: "1h" }, { h: 6, label: "6h" }, { h: 24, label: "24h" },
  { h: 168, label: "7d" }, { h: 720, label: "30d" }, { h: 8760, label: "1y" }
];

function renderExplore(root, preselect) {
  if (preselect) EX.entity = preselect;
  var wrap = el("div", "grp");
  root.appendChild(wrap);

  function draw() {
    wrap.innerHTML = "";
    wrap.appendChild(exPicker(draw));
    if (!EX.entity) {
      wrap.appendChild(el("div", "empty", EX.entities === null
        ? "Loading signals…"
        : (EX.entities.length ? "Pick a signal above to chart it."
                              : "No history recorded yet — enable [history] in config.toml.")));
      return;
    }
    wrap.appendChild(exChartCard(draw));
  }
  draw();

  if (EX.entities === null && !EX.busy) {
    EX.busy = true;
    apiGet("/api/entities")
      .then(function (list) { EX.entities = Array.isArray(list) ? list : []; })
      .catch(function () { EX.entities = []; })
      .then(function () { EX.busy = false; draw(); });
  }
  if (EX.entity) loadSeries(draw);
}

function loadSeries(done) {
  var e = EX.entity, h = EX.range;
  EX.series = null;
  apiGet("/api/series?entity=" + encodeURIComponent(e) + "&hours=" + h + "&max=800")
    .then(function (s) { if (EX.entity === e && EX.range === h) { EX.series = s; done(); } })
    .catch(function () { EX.series = { error: true, points: [] }; done(); });
}

/* Searchable, source-grouped list of everything with history. */
function exPicker(redraw) {
  var g = el("div", "grp");
  var head = el("div", "grp-title", "Explore");
  if (EX.entities) head.appendChild(el("span", "tag", EX.entities.length + " signals"));
  g.appendChild(head);

  var card = el("div", "card");
  var search = document.createElement("input");
  search.type = "search"; search.className = "ex-search";
  search.placeholder = "filter signals…  (e.g. greenhouse, pm25, weight)";
  search.value = EX.q || "";
  card.appendChild(search);

  var list = el("div", "ex-list");
  card.appendChild(list);

  function fill() {
    list.innerHTML = "";
    var q = (EX.q || "").toLowerCase();
    var items = (EX.entities || []).filter(function (x) {
      return !q || x.entity.toLowerCase().indexOf(q) >= 0;
    });
    if (!items.length) { list.appendChild(el("div", "empty", EX.entities ? "Nothing matches." : "Loading…")); return; }
    var groups = {};
    items.forEach(function (x) {
      var src = x.entity.split(".")[0];
      (groups[src] = groups[src] || []).push(x);
    });
    Object.keys(groups).sort().forEach(function (src) {
      list.appendChild(el("div", "ex-src", esc(pretty(src))));
      groups[src].forEach(function (x) {
        var b = el("button", "ex-item" + (x.entity === EX.entity ? " on" : ""));
        b.type = "button";
        b.textContent = x.entity.split(".").slice(1).join(" · ");
        b.title = x.entity;
        b.addEventListener("click", function () {
          EX.entity = x.entity; EX.series = null;
          location.hash = "#/explore/" + x.entity;   // shareable + back-button
          redraw(); loadSeries(redraw);
        });
        list.appendChild(b);
      });
    });
  }
  fill();
  search.addEventListener("input", function () { EX.q = search.value; fill(); });
  g.appendChild(card);
  return g;
}

/* Chart + stats + optional raw rows for the selected signal. */
function exChartCard(redraw) {
  var g = el("div", "grp");
  var head = el("div", "grp-title", esc(EX.entity.split(".").slice(1).join(" · ")));
  head.appendChild(el("span", "tag", esc(EX.entity)));
  g.appendChild(head);

  var card = el("div", "card");
  var bar = el("div", "ex-bar");
  EX_RANGES.forEach(function (r) {
    var b = el("button", "mbtn" + (r.h === EX.range ? " on" : ""), r.label);
    b.type = "button";
    b.addEventListener("click", function () { EX.range = r.h; redraw(); loadSeries(redraw); });
    bar.appendChild(b);
  });
  var rawBtn = el("button", "mbtn" + (EX.raw ? " on" : ""), "raw");
  rawBtn.type = "button"; rawBtn.style.marginLeft = "auto";
  rawBtn.addEventListener("click", function () { EX.raw = !EX.raw; redraw(); });
  bar.appendChild(rawBtn);
  card.appendChild(bar);

  var s = EX.series;
  if (!s) { card.appendChild(el("div", "empty", "Loading…")); g.appendChild(card); return g; }
  if (s.error) { card.appendChild(el("div", "empty", "Couldn't load this signal.")); g.appendChild(card); return g; }
  var pts = (s.points || []).filter(function (p) { return typeof p[1] === "number"; });
  if (!pts.length) {
    card.appendChild(el("div", "empty", "No data in this window."));
    g.appendChild(card); return g;
  }

  var readout = el("div", "readout"); readout.style.marginBottom = "10px";
  card.appendChild(readout);
  card.appendChild(exCanvas(pts, s.unit || "", readout));

  var vals = pts.map(function (p) { return p[1]; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var mean = avg(vals);
  var stat = el("div", "minmax");
  stat.innerHTML =
    '<span>min <b>' + lo.toFixed(2) + '</b></span>' +
    '<span>max <b>' + hi.toFixed(2) + '</b></span>' +
    '<span>mean <b>' + mean.toFixed(2) + '</b></span>' +
    '<span><b>' + s.total + '</b> points</span>' +
    (s.downsampled ? '<span style="color:var(--warn)">downsampled to ' + pts.length + '</span>' : '<span>raw</span>');
  card.appendChild(stat);
  g.appendChild(card);

  if (EX.raw) {
    var g2 = el("div", "grp");
    g2.appendChild(el("div", "grp-title", "Raw points" +
      (s.downsampled ? '<span class="tag">bucket averages — widen `max` for exact rows</span>' : '')));
    var c2 = el("div", "card"); c2.style.overflowX = "auto";
    var tbl = el("table", "ex-table");
    tbl.innerHTML = "<thead><tr><th>time</th><th>value</th></tr></thead>";
    var tb = document.createElement("tbody");
    pts.slice(-200).reverse().forEach(function (p) {
      var tr = document.createElement("tr");
      var d = new Date(p[0]);
      var td1 = document.createElement("td"); td1.textContent = d.toLocaleString();
      var td2 = document.createElement("td"); td2.textContent = p[1].toFixed(3) + (s.unit ? " " + s.unit : "");
      tr.appendChild(td1); tr.appendChild(td2); tb.appendChild(tr);
    });
    tbl.appendChild(tb); c2.appendChild(tbl);
    c2.appendChild(el("div", "minmax", '<span>newest first · showing up to 200 of ' + pts.length + '</span>'));
    g2.appendChild(c2); g.appendChild(g2);
  }
  return g;
}

/* Canvas line chart, DPR-aware, with a drag/hover readout.
   Long gaps break the line instead of drawing a straight lie across them —
   that's where hearth wasn't running, and the chart should say so. */
function exCanvas(pts, unit, readout) {
  var box = el("div", "chart"); box.style.position = "relative";
  var cv = document.createElement("canvas");
  cv.style.cssText = "width:100%;height:200px;display:block";
  box.appendChild(cv);

  var xs = pts.map(function (p) { return p[0]; });
  var ys = pts.map(function (p) { return p[1]; });
  var t0 = xs[0], t1 = xs[xs.length - 1] || t0 + 1;
  var lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
  if (hi - lo < 1e-9) { hi = lo + 1; lo -= 1; }
  var padv = (hi - lo) * 0.08; lo -= padv; hi += padv;

  // A "gap" is a step much larger than the typical one.
  var steps = [];
  for (var i = 1; i < xs.length; i++) steps.push(xs[i] - xs[i - 1]);
  steps.sort(function (a, b) { return a - b; });
  var typical = steps.length ? steps[Math.floor(steps.length / 2)] : 0;
  var gapAt = typical > 0 ? typical * 4 : Infinity;

  var PADL = 44, PADR = 8, PADT = 10, PADB = 22, cursor = null;

  function draw() {
    var dpr = window.devicePixelRatio || 1;
    var w = box.clientWidth || 320, h = 200;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    var g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    var X = function (t) { return PADL + ((t - t0) / (t1 - t0 || 1)) * (w - PADL - PADR); };
    var Y = function (v) { return PADT + (1 - (v - lo) / (hi - lo)) * (h - PADT - PADB); };

    // grid + value labels
    g.font = "10px ui-monospace, monospace";
    g.textBaseline = "middle";
    for (var k = 0; k <= 4; k++) {
      var v = lo + (hi - lo) * (k / 4), y = Y(v);
      g.strokeStyle = "rgba(255,255,255,.06)"; g.beginPath();
      g.moveTo(PADL, y); g.lineTo(w - PADR, y); g.stroke();
      g.fillStyle = "#78705f"; g.textAlign = "right";
      g.fillText(v.toFixed(Math.abs(hi - lo) < 5 ? 2 : 0), PADL - 6, y);
    }
    // time labels
    g.textAlign = "center"; g.textBaseline = "top";
    [0, 0.5, 1].forEach(function (f) {
      var t = t0 + (t1 - t0) * f, d = new Date(t);
      var span = t1 - t0;
      var lbl = span > 86400000 * 2
        ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
        : d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      g.fillStyle = "#78705f";
      g.fillText(lbl, Math.min(w - PADR - 18, Math.max(PADL + 18, X(t))), h - PADB + 6);
    });

    // area + line, broken across gaps
    var segs = [[]];
    for (var i2 = 0; i2 < xs.length; i2++) {
      if (i2 && xs[i2] - xs[i2 - 1] > gapAt) segs.push([]);
      segs[segs.length - 1].push(i2);
    }
    segs.forEach(function (seg) {
      if (seg.length < 1) return;
      g.beginPath();
      seg.forEach(function (i3, n) { var x = X(xs[i3]), y = Y(ys[i3]); n ? g.lineTo(x, y) : g.moveTo(x, y); });
      if (seg.length > 1) {
        var grad = g.createLinearGradient(0, PADT, 0, h - PADB);
        grad.addColorStop(0, "rgba(203,162,78,.26)"); grad.addColorStop(1, "rgba(203,162,78,0)");
        g.lineTo(X(xs[seg[seg.length - 1]]), h - PADB);
        g.lineTo(X(xs[seg[0]]), h - PADB);
        g.closePath(); g.fillStyle = grad; g.fill();
      }
      g.beginPath();
      seg.forEach(function (i3, n) { var x = X(xs[i3]), y = Y(ys[i3]); n ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.strokeStyle = "#cba24e"; g.lineWidth = 1.8; g.lineJoin = "round"; g.lineCap = "round";
      if (seg.length === 1) { g.arc(X(xs[seg[0]]), Y(ys[seg[0]]), 1.8, 0, 6.284); g.fillStyle = "#cba24e"; g.fill(); }
      else g.stroke();
    });

    if (cursor != null) {
      var cx = X(xs[cursor]), cy = Y(ys[cursor]);
      g.strokeStyle = "rgba(242,236,224,.5)"; g.lineWidth = 1;
      g.beginPath(); g.moveTo(cx, PADT); g.lineTo(cx, h - PADB); g.stroke();
      g.beginPath(); g.arc(cx, cy, 3.5, 0, 6.284); g.fillStyle = "#f2ece0"; g.fill();
    }
    stamp();
  }

  function stamp() {
    var i = cursor == null ? xs.length - 1 : cursor;
    var d = new Date(xs[i]);
    readout.innerHTML =
      '<span class="ro-d">' + esc(d.toLocaleString()) + (cursor == null ? ' <em>latest</em>' : '') + '</span>' +
      '<span class="ro-v">' + ys[i].toFixed(2) + (unit ? ' <small>' + esc(unit) + '</small>' : '') + '</span>';
  }

  scrub(box, xs.length, function (i) { cursor = i; draw(); });
  // Redraw on resize so the canvas stays sharp when the panel rotates/zooms.
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  setTimeout(draw, 0);
  return box;
}

/* ---------- fetch + poll + wake ---------- */
function apiGet(path) {
  var opt = TOKEN ? { headers: { Authorization: "Bearer " + TOKEN } } : {};
  return fetch(path, opt).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}
function pull() {
  return Promise.all([apiGet("/api/latest"), apiGet("/api/history").catch(function () { return null; })])
    .then(function (res) {
      var m = model(res[0], res[1]); paint(m);
      try { localStorage.setItem("hearth.snap", JSON.stringify(res[0])); localStorage.setItem("hearth.hist", JSON.stringify(res[1] || {})); } catch (e) {}
      stamp(true);
    })
    .catch(function () { stamp(false); });
}
function stamp(ok) {
  var d = new Date(), hh = d.getHours() < 10 ? "0" + d.getHours() : d.getHours(), mm = d.getMinutes() < 10 ? "0" + d.getMinutes() : d.getMinutes();
  document.getElementById("updated").textContent = (ok ? "updated " : "offline · ") + hh + ":" + mm;
  document.getElementById("src").textContent = ok ? "live · polling 12s" : "offline — showing last data";
}
function tick() {
  var d = new Date(), h = d.getHours(), mi = d.getMinutes(), ap = h >= 12 ? "PM" : "AM", hh = (h % 12) || 12;
  document.getElementById("clock").textContent = hh + ":" + (mi < 10 ? "0" + mi : mi) + " " + ap;
  document.getElementById("date").textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}

window.addEventListener("hashchange", function () { if (LAST) paint(LAST); });

(function boot() {
  var snap = FALLBACK, hist = FALLBACK_HIST;
  try { var s = localStorage.getItem("hearth.snap"); if (s) snap = JSON.parse(s); var h = localStorage.getItem("hearth.hist"); if (h) hist = JSON.parse(h); } catch (e) {}
  paint(model(snap, hist));
  tick(); setInterval(tick, 10000);
  pull();
  setInterval(function () { if (!document.hidden) pull(); }, 12000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) pull(); });
  window.addEventListener("focus", pull);
  window.addEventListener("pageshow", pull);
  setInterval(function () { if (document.hidden) location.reload(); }, 20 * 60 * 1000);
})();
</script>
