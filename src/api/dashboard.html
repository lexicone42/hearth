<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearth — Home Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* Hearth Board — portrait multi-view home dashboard for the Samsung Family
     Hub fridge (probed: 720x1040 CSS px, portrait, Chromium 130). One page,
     tabbed views swapped client-side via #hash routes (no reloads). Committed
     single dark world; warm brown-black + brass; semantic good/warn/crit kept
     distinct from the brand accent. */
  :root {
    --bg:#1a1712; --bg-2:#241f19; --bg-3:#2d271f; --hair:#3a3228;
    --ink:#f2ece0; --muted:#a89f8f; --faint:#78705f;
    --brass:#cba24e; --good:#77c08a; --warn:#e7a93e; --crit:#dc6a4c; --cool:#7fb6e0;
    --pee:#78b2dc; --poop:#b07a3c;
    --ava:#e2875f; --teddy:#52b1a3; --helly:#a996db; --jame:#d6a63e;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; line-height: 1.3;
    padding: 16px 16px 28px;
    background: radial-gradient(680px 480px at 84% -8%, #241c14 0%, rgba(36,28,20,0) 62%), var(--bg);
  }
  .board { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; flex-direction: column; gap: 10px; }
  .hrow { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .mark { font-size: 25px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .mark b { color: var(--brass); }
  .clock { font-family: var(--mono); font-size: 28px; font-variant-numeric: tabular-nums; }
  .date { color: var(--muted); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
  .verdict { display: inline-flex; align-items: center; gap: 9px; padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; border: 1px solid transparent; }
  .verdict .dot { width: 9px; height: 9px; border-radius: 50%; }
  .verdict.ok { background: rgba(119,192,138,.12); border-color: rgba(119,192,138,.32); color: var(--good); }
  .verdict.ok .dot { background: var(--good); box-shadow: 0 0 10px var(--good); }
  .verdict.attn { background: rgba(231,169,62,.13); border-color: rgba(231,169,62,.34); color: var(--warn); }
  .verdict.attn .dot { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .updated { color: var(--faint); font-size: 11.5px; font-family: var(--mono); }

  /* nav */
  nav { display: flex; gap: 7px; flex-wrap: wrap; border-bottom: 1px solid var(--hair); padding-bottom: 12px; }
  .tab { appearance: none; border: 1px solid var(--hair); background: var(--bg-2); color: var(--muted);
    font: inherit; font-size: 14px; font-weight: 600; padding: 8px 15px; border-radius: 999px; cursor: pointer; text-decoration: none; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: #241b12; background: var(--brass); border-color: var(--brass); }
  .tab:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  section.view { display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; margin: 2px; }
  .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
  .eyebrow .count { color: var(--muted); letter-spacing: 0.06em; }
  .grp { display: flex; flex-direction: column; gap: 9px; }
  .card { background: linear-gradient(180deg, var(--bg-2), #201b15); border: 1px solid var(--hair); border-radius: 14px; padding: 14px; }

  /* litter */
  .boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .box { position: relative; overflow: hidden; }
  .box::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--good); }
  .box.warn::before { background: var(--warn); } .box.crit::before { background: var(--crit); }
  .box-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .box-name { font-size: 16px; font-weight: 650; }
  .pill { font-size: 11px; font-weight: 650; padding: 4px 9px; border-radius: 999px; align-self: flex-start; white-space: nowrap; }
  .pill.good { color: var(--good); background: rgba(119,192,138,.13); }
  .pill.warn { color: var(--warn); background: rgba(231,169,62,.14); }
  .pill.crit { color: #241b12; background: var(--crit); }
  .meter { margin-top: 10px; }
  .meter-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .meter-label { font-size: 11.5px; color: var(--muted); }
  .meter-val { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
  .track { height: 9px; border-radius: 6px; background: var(--bg-3); overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; transition: width .6s ease; }

  /* cats grid (overview) + cat detail */
  .cats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .cat { display: flex; flex-direction: column; gap: 8px; }
  .cat-head { display: flex; align-items: center; gap: 9px; }
  .chip { width: 12px; height: 12px; border-radius: 50%; }
  .cat-name { font-size: 17px; font-weight: 650; }
  .cat-weight { display: flex; align-items: baseline; gap: 6px; }
  .cat-weight .n { font-family: var(--mono); font-size: 36px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .cat-weight .u { color: var(--muted); font-size: 14px; }
  .spark { width: 100%; display: block; }
  .cat-foot { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
  .trend { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
  .trend.flat { color: var(--muted); } .trend.down { color: var(--warn); } .trend.up { color: var(--good); }
  .visits { color: var(--faint); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .cat-detail .spark { height: 88px; }
  .cat-detail { gap: 10px; }
  .minmax { display: flex; gap: 16px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .minmax b { color: var(--ink); font-weight: 600; }

  /* generic metric groups (weather / air) */
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .m { display: flex; flex-direction: column; gap: 3px; padding: 12px; }
  .m .lbl { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .m .v { font-family: var(--mono); font-size: 21px; font-variant-numeric: tabular-nums; }
  .m .v small { font-family: var(--ui); font-size: 12px; color: var(--muted); margin-left: 2px; }
  .m.cold .v { color: var(--cool); } .m.hot .v { color: var(--warn); }
  .grp-title { font-size: 15px; font-weight: 650; margin: 2px 2px -2px; display: flex; align-items: center; gap: 9px; }
  .grp-title .tag { font-size: 11px; font-weight: 600; color: var(--faint); font-family: var(--mono); }

  .empty { color: var(--muted); padding: 20px; text-align: center; }

  /* scrubbable charts + the shared day readout */
  .chart { position: relative; touch-action: pan-y; cursor: crosshair; }
  .readout {
    display: flex; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
    padding: 11px 14px; background: var(--bg-2); border: 1px solid var(--hair);
    border-radius: 12px; font-family: var(--mono); font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .readout .ro-d { color: var(--brass); font-weight: 600; }
  .readout .ro-d em { color: var(--faint); font-style: normal; font-size: 12px; }
  .readout .ro-v small { color: var(--muted); font-size: 11.5px; margin-left: 1px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; }
  .lg i { width: 9px; height: 9px; border-radius: 2px; font-style: normal; }
  .brow { display: flex; align-items: center; gap: 10px; }
  .brow .bl { width: 104px; font-size: 13px; color: var(--muted); }
  .brow .bt { flex: 1; height: 14px; background: var(--bg-3); border-radius: 5px; overflow: hidden; display: flex; }
  .brow .bn { width: 62px; text-align: right; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  footer { display: flex; align-items: center; justify-content: space-between; color: var(--faint); font-size: 11.5px; padding-top: 2px; }
  .live { display: inline-flex; align-items: center; gap: 8px; }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .live .dot, .fill { animation: none; transition: none; } }
</style>
</head>
<body>

<div class="board">
  <header>
    <div class="hrow">
      <div class="mark">Hea<b>r</b>th</div>
      <div style="text-align:right"><div id="clock" class="clock">--:--</div><div id="date" class="date"></div></div>
    </div>
    <div class="hrow">
      <div id="verdict" class="verdict ok"><span class="dot"></span><span id="verdict-text">&mdash;</span></div>
      <div id="updated" class="updated">connecting&hellip;</div>
    </div>
    <nav id="nav"></nav>
  </header>
  <section id="view" class="view"></section>
  <footer><span class="live"><span class="dot"></span><span>hearth</span></span><span id="src">live</span></footer>
</div>

<script>
/* ------------------------------------------------------------------ *
 * Live wiring: hearth serves this file and injects the API token. The
 * page polls /api/latest (+ /api/history for sparklines), paints from
 * localStorage instantly, and REFETCHES ON WAKE. Views swap via #hash
 * (no reloads). Unreachable (e.g. claude.ai preview) -> embedded snapshot.
 * ------------------------------------------------------------------ */
var TOKEN = "__HEARTH_API_TOKEN__"; if (TOKEN.indexOf("__HEARTH") === 0) TOKEN = "";
var CAT_COLOR = { ava: "var(--ava)", teddy: "var(--teddy)", helly: "var(--helly)", jame: "var(--jame)" };
var TH = { drawerFull: 90, litterLow: 10, drawerWarn: 70, litterWarn: 25 };

/* friendly names for known nodes; anything else is prettified from its slug */
var NODE = {
  outdoor: "Outdoor", indoor: "Indoor", sensor_1: "Greenhouse", sensor_4: "Greenhouse · West",
  sensor_7: "Freezer", soil_3: "Greenhouse Soil", rain: "Rain", wind: "Wind", sun: "Sun",
  barometer: "Barometer"
};
var COLD = { Freezer: 1 }, HOT = { Greenhouse: 1, "Greenhouse · West": 1 };

/* embedded fallback, shaped exactly like /api/latest, so preview == live path */
var FALLBACK = { entities: [
  ent("whisker.ava.weight","Weight",7.5,"lb"), ent("whisker.helly.weight","Weight",9.5,"lb"),
  ent("whisker.teddy.weight","Weight",9.6,"lb"), ent("whisker.jame.weight","Weight",11.8,"lb"),
  box("piano_room",100,31,"Ready",false), box("bonus_room",98,49,"Ready",false), box("guest_room_5",77,25,"Ready",false),
  ent("ambient_weather.outdoor.temperature","Temperature",69.1,"°F"), ent("ambient_weather.outdoor.feels_like","ApparentTemperature",69.1,"°F"),
  ent("ambient_weather.outdoor.humidity","Humidity",72,"%"), ent("ambient_weather.outdoor.dew_point","DewPoint",59.7,"°F"),
  ent("ambient_weather.indoor.temperature","Temperature",67.8,"°F"), ent("ambient_weather.indoor.humidity","Humidity",70,"%"),
  ent("ambient_weather.sensor_7.temperature","Temperature",-3.8,"°F"), ent("ambient_weather.sensor_1.temperature","Temperature",76.3,"°F"),
  ent("ambient_weather.sensor_4.temperature","Temperature",80.1,"°F"), ent("ambient_weather.soil_3.moisture","SoilMoisture",2,"%"),
  ent("ambient_weather.rain.daily","PrecipitationAccumulation",0,"in"), ent("ambient_weather.rain.weekly","PrecipitationAccumulation",0,"in"),
  ent("ambient_weather.rain.monthly","PrecipitationAccumulation",0.2,"in"), ent("ambient_weather.rain.yearly","PrecipitationAccumulation",29.2,"in"),
  ent("ambient_weather.wind.speed","WindSpeed",4,"mph"), ent("ambient_weather.wind.gust","WindGust",9,"mph"), ent("ambient_weather.wind.bearing","WindBearing",159,"°"),
  ent("ambient_weather.sun.uv_index","UvIndex",7,""), ent("ambient_weather.sun.solar_radiation","SolarRadiation",741,"W/m²"),
  ent("ambient_weather.barometer.relative","Pressure",29.7,"inHg"),
  ent("dyson.living.pm25","Pm25",4,"µg/m³"), ent("dyson.living.pm10","Pm10",8,"µg/m³"), ent("dyson.living.voc","VolatileOrganicCompounds",35,""),
  ent("dyson.living.nitrogen_dioxide","NitrogenDioxide",4,""), ent("dyson.living.fan_speed","FanSpeed",3,""), ent("dyson.living.filter_life","FilterLife",89,"%"),
  ent("dyson.living.temperature","Temperature",70.2,"°F"), ent("dyson.living.humidity","Humidity",48,"%")
] };
var FALLBACK_HIST = {
  ava: { series: [7.48,7.38,7.46,7.55,7.52,7.30,7.43,7.45,7.39,7.54], visits: 35 },
  helly: { series: [9.49,9.47,9.52,9.49,9.50,9.47,9.44,9.46,9.52,9.49], visits: 82 },
  teddy: { series: [9.80,9.86,9.78,9.83,9.80,9.74,9.74,9.73,9.64,9.61], visits: 26 },
  jame: { series: [11.75,11.67,11.76,11.82,11.79,11.80,11.67,11.68,11.66,11.69], visits: 43 }
};
function ent(id, cls, val, unit) { return { entity: id, class: cls, value: val, unit: unit, display: val + (unit ? " " + unit : "") }; }
function box(slug, litter, drawer, status, needs) { return [
  ent("whisker." + slug + ".litter_level","LitterLevel",litter,"%"),
  ent("whisker." + slug + ".waste_drawer","WasteDrawer",drawer,"%"),
  { entity: "whisker." + slug + ".status", class: "Status", value: status, display: status },
  { entity: "whisker." + slug + ".needs_service", class: "Alert", value: needs, display: String(needs) }
]; }
FALLBACK.entities = FALLBACK.entities.reduce(function (a, x) { return a.concat(x); }, []); // flatten box() arrays

/* ---------- helpers ---------- */
function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
function pretty(seg) { return seg.split("_").map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(" "); }
function num(x) { return x == null ? null : Number(x); }

/* ---------- normalize /api/latest into a model ---------- */
function model(snap, hist) {
  var ents = snap.entities || [], byId = {}, nodes = {};
  ents.forEach(function (e) {
    byId[e.entity] = e;
    var p = e.entity.split("."); if (p.length < 3) return;
    var src = p[0], node = p[1], chan = p.slice(2).join(".");
    (nodes[src] = nodes[src] || {}); (nodes[src][node] = nodes[src][node] || {})[chan] = e;
  });
  /* litter + cats from whisker nodes */
  var boxes = [], cats = [];
  Object.keys(nodes.whisker || {}).forEach(function (node) {
    var n = nodes.whisker[node];
    if (n.litter_level || n.waste_drawer) {
      boxes.push({ slug: node, name: pretty(node),
        litter: n.litter_level ? num(n.litter_level.value) : 100,
        drawer: n.waste_drawer ? num(n.waste_drawer.value) : 0,
        status: n.status ? String(n.status.value) : "Ready",
        needs: n.needs_service ? n.needs_service.value === true : false });
    } else if (n.weight) {
      cats.push({ slug: node, name: pretty(node), weight: num(n.weight.value),
        visits: (hist && hist[node] && hist[node].visits) || 0,
        series: (hist && hist[node] && hist[node].series) || null });
    }
  });
  boxes.sort(function (a, b) { return a.name < b.name ? -1 : 1; });
  cats.sort(function (a, b) { return a.weight - b.weight; });
  return { byId: byId, nodes: nodes, boxes: boxes, cats: cats };
}

/* ---------- view definitions ---------- */
var VIEWS = [
  { id: "overview", label: "Overview", show: function () { return true; }, render: renderOverview },
  { id: "cats", label: "Cats", show: function (m) { return m.cats.length > 0; }, render: renderCats },
  { id: "gallery", label: "Gallery", show: function (m) { return m.cats.length > 0; }, render: renderGallery },
  { id: "weather", label: "Weather", show: function (m) { return !!m.nodes.ambient_weather; }, render: function (m, r) { renderMetrics(m, r, "ambient_weather"); } },
  { id: "air", label: "Air", show: function (m) { return !!m.nodes.dyson; }, render: function (m, r) { renderMetrics(m, r, "dyson"); } }
];
var current = (location.hash.replace(/^#\/?/, "") || "overview");
var LAST = null; /* last model, for re-render on tab switch */

function renderNav(m) {
  var nav = document.getElementById("nav"); nav.innerHTML = "";
  VIEWS.forEach(function (v) {
    if (!v.show(m)) return;
    var a = el("a", "tab" + (v.id === current ? " active" : ""), v.label);
    a.href = "#/" + v.id;
    nav.appendChild(a);
  });
}
/* Slugs are always lowercase [a-z0-9_] (server-side slugify). Validating the
   fragment here closes the DOM-XSS vector: a hostile #/cat/<payload> fails the
   test and falls back to overview, so nothing from the URL reaches innerHTML. */
var SLUG_RE = /^[a-z0-9_]+$/;
function route() {
  var h = location.hash.replace(/^#\/?/, ""), p = h.split("/");
  if (p[0] === "cat" && SLUG_RE.test(p[1] || "")) return { view: "cat", slug: p[1] };
  return { view: SLUG_RE.test(h) ? h : "overview" };
}
/* Escape text destined for an innerHTML template (defense in depth for values
   that originate from a vendor API — statuses, device names). */
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function paint(m) {
  LAST = m;
  var r = route();
  current = r.view === "cat" ? "cats" : r.view;
  renderNav(m);
  var root = document.getElementById("view"); root.innerHTML = "";
  if (r.view === "cat") { renderCatDetail(r.slug, m, root); return; }
  (VIEWS.filter(function (x) { return x.id === current && x.show(m); })[0] || VIEWS[0]).render(m, root);
}

/* ---------- OVERVIEW ---------- */
function renderOverview(m, root) {
  var attention = 0;
  var sec = el("div", "grp");
  sec.appendChild(el("div", "eyebrow", 'Litter Boxes <span id="bc" class="count"></span>'));
  var wrap = el("div", "boxes");
  m.boxes.forEach(function (b) {
    var sv = sevBox(b); if (sv !== "good") attention++;
    var card = el("div", "card box " + (sv === "good" ? "" : sv));
    var label = sv === "crit" ? (b.needs ? "Needs changing" : (b.litter <= TH.litterLow ? "Add litter" : "Empty drawer")) : (sv === "warn" ? "Getting there" : (b.status || "Ready"));
    card.appendChild(el("div", "box-head", '<div class="box-name">' + esc(b.name) + '</div><div class="pill ' + sv + '">' + esc(label) + '</div>'));
    card.appendChild(meter("Litter", b.litter, b.litter <= TH.litterLow ? "var(--crit)" : (b.litter <= TH.litterWarn ? "var(--warn)" : "var(--good)")));
    card.appendChild(meter("Drawer", b.drawer, b.drawer >= TH.drawerFull ? "var(--crit)" : (b.drawer >= TH.drawerWarn ? "var(--warn)" : "#8a7f6b")));
    wrap.appendChild(card);
  });
  sec.appendChild(wrap); root.appendChild(sec);

  if (m.cats.length) {
    var cs = el("div", "grp");
    cs.appendChild(el("div", "eyebrow", 'Cats <span class="count">tap “Cats” for trends</span>'));
    var cg = el("div", "cats");
    m.cats.forEach(function (c) { cg.appendChild(catCard(c, 42, false)); });
    cs.appendChild(cg); root.appendChild(cs);
  }

  /* weather highlights */
  if (m.nodes.ambient_weather) {
    var hs = el("div", "grp");
    hs.appendChild(el("div", "eyebrow", "Around the House"));
    var hl = el("div", "metrics");
    [["outdoor","temperature","Outdoor"],["indoor","temperature","Indoor"],["sensor_7","temperature","Freezer"],
     ["sensor_4","temperature","Greenhouse"],["sun","uv_index","UV Index"],["barometer","relative","Pressure"]].forEach(function (t) {
      var e = m.byId["ambient_weather." + t[0] + "." + t[1]]; if (!e) return;
      hl.appendChild(metric(t[2], e, COLD[t[2]] ? "cold" : (HOT[t[2]] ? "hot" : "")));
    });
    hs.appendChild(hl); root.appendChild(hs);
  }

  document.getElementById("bc").textContent = attention === 0 ? "all ready" : attention + " need attention";
  setVerdict(attention);
}

/* ---------- CATS (detail) ---------- */
function renderCats(m, root) {
  m.cats.forEach(function (c) {
    var color = CAT_COLOR[c.slug] || "var(--brass)";
    var s = c.series && c.series.length > 1 ? c.series : [c.weight, c.weight];
    var lo = Math.min.apply(null, s), hi = Math.max.apply(null, s);
    var delta = s[s.length - 1] - s[0];
    var dir = Math.abs(delta) < 0.12 ? "flat" : (delta < 0 ? "down" : "up");
    var arrow = dir === "flat" ? "steady over 10 days" : ((dir === "down" ? "▼ " : "▲ ") + Math.abs(delta).toFixed(1) + " lb / 10 days");
    var card = el("div", "card cat cat-detail");
    card.appendChild(catHead(c.slug, c.name, color, 30));
    card.appendChild(el("div", "cat-weight", '<span class="n">' + Number(c.weight).toFixed(1) + '</span><span class="u">lb now</span>'));
    card.appendChild(sparkline(s, color, 88));
    card.appendChild(el("div", "minmax", '<span>low <b>' + lo.toFixed(1) + '</b></span><span>high <b>' + hi.toFixed(1) + '</b></span><span>' + c.visits + ' visits / 10d</span>'));
    card.appendChild(el("div", "cat-foot", '<span class="trend ' + dir + '">' + arrow + '</span><span class="visits">full history ›</span>'));
    linkToCat(card, c.slug);
    root.appendChild(card);
  });
  setVerdict(countAttention(m));
}

/* ---------- METRICS (weather / air) — group by node, show all channels ---------- */
function renderMetrics(m, root, src) {
  var group = m.nodes[src] || {};
  var order = Object.keys(group).sort(function (a, b) {
    return (NODE[a] || pretty(a)) < (NODE[b] || pretty(b)) ? -1 : 1;
  });
  if (!order.length) { root.appendChild(el("div", "empty", "No data yet.")); return; }
  order.forEach(function (node) {
    var label = NODE[node] || pretty(node);
    var g = el("div", "grp");
    g.appendChild(el("div", "grp-title", label + '<span class="tag">' + src + "." + node + "</span>"));
    var mg = el("div", "card"); var grid = el("div", "metrics");
    var chans = group[node];
    Object.keys(chans).sort().forEach(function (ch) {
      var e = chans[ch];
      if (e.class === "BatteryLow" || e.class === "Timestamp") return; /* skip noise */
      grid.appendChild(metric(pretty(ch), e, COLD[label] ? "cold" : (HOT[label] ? "hot" : "")));
    });
    mg.appendChild(grid); g.appendChild(mg); root.appendChild(g);
  });
  setVerdict(countAttention(m));
}

/* ---------- shared bits ---------- */
function sevBox(b) {
  if (b.drawer >= TH.drawerFull || b.litter <= TH.litterLow || b.needs) return "crit";
  if (b.drawer >= TH.drawerWarn || b.litter <= TH.litterWarn) return "warn";
  return "good";
}
function countAttention(m) { var n = 0; m.boxes.forEach(function (b) { if (sevBox(b) !== "good") n++; }); return n; }
function setVerdict(attention) {
  var v = document.getElementById("verdict"), vt = document.getElementById("verdict-text");
  if (attention === 0) { v.className = "verdict ok"; vt.textContent = "All clear"; }
  else { v.className = "verdict attn"; vt.textContent = attention + (attention === 1 ? " box needs you" : " boxes need you"); }
}
function meter(lbl, val, color) {
  var m = el("div", "meter");
  m.appendChild(el("div", "meter-top", '<span class="meter-label">' + lbl + '</span><span class="meter-val">' + Math.round(val) + '%</span>'));
  var track = el("div", "track"), fill = el("div", "fill");

}
function metric(lbl, e, cls) {
  var card = el("div", "m " + (cls || ""));
  card.appendChild(el("div", "lbl", lbl));
  var val = e.unit
    ? '<span>' + esc(fmtNum(e.value)) + '</span><small>' + esc(e.unit) + '</small>'
    : esc(String(e.value));
  card.appendChild(el("div", "v", val));

}
function fmtNum(v) { var n = Number(v); return isNaN(n) ? String(v) : (Math.abs(n) >= 100 ? Math.round(n) : n.toFixed(1)); }
function catCard(c, sparkH, detail) {
  var color = CAT_COLOR[c.slug] || "var(--brass)";
  var s = c.series && c.series.length > 1 ? c.series : [c.weight, c.weight];
  var delta = s[s.length - 1] - s[0];
  var dir = Math.abs(delta) < 0.12 ? "flat" : (delta < 0 ? "down" : "up");
  var arrow = dir === "flat" ? "steady" : ((dir === "down" ? "▼ " : "▲ ") + Math.abs(delta).toFixed(1) + " lb");
  var card = el("div", "card cat");
  card.appendChild(catHead(c.slug, c.name, color, 30));
  card.appendChild(el("div", "cat-weight", '<span class="n">' + Number(c.weight).toFixed(1) + '</span><span class="u">lb</span>'));
  card.appendChild(sparkline(s, color, sparkH));
  card.appendChild(el("div", "cat-foot", '<span class="trend ' + dir + '">' + arrow + '</span><span class="visits">' + (c.visits || 0) + ' ›</span>'));
  linkToCat(card, c.slug);
  return card;
}
/* make a cat card tap through to its detail page */
function linkToCat(card, slug) {
  card.style.cursor = "pointer";
  card.setAttribute("role", "link");
  card.setAttribute("tabindex", "0");
  card.addEventListener("click", function () { location.hash = "#/cat/" + slug; });
  card.addEventListener("keydown", function (e) { if (e.key === "Enter") location.hash = "#/cat/" + slug; });
}
function sparkline(series, color, H) {
  var W = 300, pad = 4;
  var min = Math.min.apply(null, series), max = Math.max.apply(null, series), rng = (max - min) || 1;
  var sx = (W - pad * 2) / (series.length - 1);
  var pts = series.map(function (v, i) { return [pad + i * sx, pad + (1 - (v - min) / rng) * (H - pad * 2)]; });
  var line = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  var area = line + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (H - pad) + " L" + pts[0][0].toFixed(1) + " " + (H - pad) + " Z";
  var e = pts[pts.length - 1], id = "g" + Math.round(e[1] * 100) + series.length + Math.round(H);
  var svg = '<svg class="spark" style="height:' + H + 'px" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity="0.28"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#' + id + ')"/><path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + e[0].toFixed(1) + '" cy="' + e[1].toFixed(1) + '" r="3.2" fill="' + color + '"/></svg>';
  var d = el("div"); d.innerHTML = svg; return d.firstChild;
}

/* ---------- cat photos (served same-origin from hearth; initial-circle fallback) ---------- */

/* ---------- per-cat DETAIL view (#/cat/<slug>) ---------- */
var VISITS_CACHE = {};
function renderCatDetail(slug, m, root) {
  var cat = (m.cats.filter(function (c) { return c.slug === slug; })[0]) ||
    { slug: slug, name: pretty(slug), weight: 0, series: null, visits: 0 };
  var color = CAT_COLOR[slug] || "var(--brass)";

  var back = el("a", "tab", "‹ All cats"); back.href = "#/cats"; root.appendChild(back);
  var head = el("div", "card cat");
  head.appendChild(catHead(cat.slug, cat.name, color, 56));
  head.appendChild(el("div", "cat-weight", '<span class="n">' + Number(cat.weight).toFixed(1) + '</span><span class="u">lb now</span>'));
  root.appendChild(head);

  var body = el("div", "grp");
  body.appendChild(el("div", "empty", "Loading " + cat.name + "’s history…"));
  root.appendChild(body);

  function draw(v) { body.innerHTML = ""; drawCatCharts(cat, color, v, body); }
  if (VISITS_CACHE[slug]) { draw(VISITS_CACHE[slug]); return; }
  apiGet("/api/visits?cat=" + encodeURIComponent(slug) + "&days=30")
    .then(function (v) { VISITS_CACHE[slug] = v; draw(v); })
    .catch(function () { var v = synthVisits(cat); VISITS_CACHE[slug] = v; draw(v); });
}
function titleCase(s) { return String(s).split(" ").map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(" "); }

function drawCatCharts(cat, color, visits, root) {
  if (!visits.length) { root.appendChild(el("div", "empty", "No visits recorded yet.")); return; }

  /* ---- bucket per calendar day, FILLING empty days: a zero-visit day is real
     signal for frequency, so a gap must never be silently skipped. ---- */
  var byDay = {};
  visits.forEach(function (v) {
    var iso = String(v.ts).slice(0, 10);
    var e = byDay[iso] || (byDay[iso] = { iso: iso, w: [], dur: [], out: [], pee: 0, poop: 0, n: 0 });
    if (typeof v.weight === "number") e.w.push(v.weight);
    if (typeof v.duration === "number" && v.duration > 0) e.dur.push(v.duration);
    if (typeof v.waste_weight === "number" && v.waste_weight > 0) e.out.push(v.waste_weight);
    e.n++;
    if (v.waste === "Urine") e.pee++; else if (v.waste === "Feces") e.poop++;
  });
  var days = fillGaps(byDay);
  days.forEach(function (d) {
    d.med = med(d.w); d.lo = d.w.length ? Math.min.apply(null, d.w) : null; d.hi = d.w.length ? Math.max.apply(null, d.w) : null;
    d.durMed = med(d.dur);
  });

  /* Today is still in progress — including it in the average would make every
     morning look like "pooping less than normal". Average over complete days. */
  var partial = days.length > 0 && days[days.length - 1].iso === isoDay(new Date());
  var full = (partial && days.length > 1) ? days.slice(0, days.length - 1) : days;
  var peeAvg = avg(full.map(function (d) { return d.pee; }));
  var poopAvg = avg(full.map(function (d) { return d.poop; }));
  var durAvg = avg(full.map(function (d) { return d.durMed; }).filter(function (x) { return x != null; }));

  /* ---- summary ---- */
  var totPee = 0, totPoop = 0, allW = [], allOut = [];
  days.forEach(function (d) { totPee += d.pee; totPoop += d.poop; allW = allW.concat(d.w); allOut = allOut.concat(d.out); });
  var wLo = allW.length ? Math.min.apply(null, allW) : 0, wHi = allW.length ? Math.max.apply(null, allW) : 0;
  var sum = el("div", "minmax");
  sum.innerHTML =
    '<span>range <b>' + wLo.toFixed(1) + '–' + wHi.toFixed(1) + ' lb</b></span>' +
    '<span><b>' + visits.length + '</b> visits / ' + days.length + 'd</span>' +
    '<span><b>' + totPee + '</b> pees · <b>' + totPoop + '</b> poops</span>' +
    (allOut.length ? '<span>output <b>' + Math.round(med(allOut)) + ' g</b></span>' : '');
  root.appendChild(wrapCard(sum));

  /* ---- shared day cursor: one drag moves every chart together ---- */
  var readout = el("div", "readout"); root.appendChild(readout);
  var charts = [];
  function show(i) {
    if (i == null || i < 0) i = days.length - 1;
    if (i > days.length - 1) i = days.length - 1;
    charts.forEach(function (c) { c.setCursor(i); });
    var d = days[i], last = (i === days.length - 1);
    readout.innerHTML =
      '<span class="ro-d">' + esc(fmtDay(d.iso)) + (last && partial ? ' <em>so far</em>' : '') + '</span>' +
      '<span class="ro-v">' + (d.med == null ? '—' : d.med.toFixed(2) + ' <small>lb</small>') + '</span>' +
      '<span class="ro-v" style="color:var(--pee)">' + d.pee + ' <small>pee</small></span>' +
      '<span class="ro-v" style="color:var(--poop)">' + d.poop + ' <small>poop</small></span>' +
      '<span class="ro-v">' + (d.durMed == null ? '—' : esc(fmtDur(d.durMed))) + ' <small>in box</small></span>';
  }

  function addChart(title, opts, caption) {
    var c = dayChart(days, opts, partial);
    charts.push(c);
    scrub(c.node, days.length, show);
    root.appendChild(chartSection(title, c.node, caption));
  }

  addChart("Weight — median & daily range", { value: function (d) { return d.med; }, band: true, color: color },
    'drag anywhere on a chart to read any day');
  addChart("Pee per day", { value: function (d) { return d.pee; }, zero: true, mean: peeAvg, color: "var(--pee)", height: 72 },
    'normally <b>' + peeAvg.toFixed(1) + '</b>/day <span style="color:var(--faint)">— dashed line</span>');
  addChart("Poop per day", { value: function (d) { return d.poop; }, zero: true, mean: poopAvg, color: "var(--poop)", height: 72 },
    'normally <b>' + poopAvg.toFixed(1) + '</b>/day <span style="color:var(--faint)">— dashed line</span>');
  if (durAvg > 0) {
    addChart("Time in box", { value: function (d) { return d.durMed; }, zero: true, mean: durAvg, color: "var(--brass)", height: 72 },
      'normally <b>' + fmtDur(durAvg) + '</b> per visit <span style="color:var(--faint)">— a rising trend is worth a look</span>');
  }

  /* ---- box preference, split by pee vs poop ---- */
  var bx = {};
  visits.forEach(function (v) {
    var b = bx[v.box_name] || (bx[v.box_name] = { label: titleCase(v.box_name), pee: 0, poop: 0, total: 0 });
    b.total++;
    if (v.waste === "Urine") b.pee++; else if (v.waste === "Feces") b.poop++;
  });
  var boxes = Object.keys(bx).map(function (k) { return bx[k]; }).sort(function (a, b) { return b.total - a.total; });
  root.appendChild(chartSection("Which box, for what", splitBars(boxes),
    '<span class="lg"><i style="background:var(--pee)"></i>pee</span><span class="lg"><i style="background:var(--poop)"></i>poop</span>'));

  show(null);   /* start on the most recent day */
}

/* Fill every calendar day between the first and last seen, so a day with no
   visits plots as a real zero instead of vanishing. */
function fillGaps(byDay) {
  var keys = Object.keys(byDay).sort();
  if (!keys.length) return [];
  var out = [], cur = parseDay(keys[0]), end = parseDay(keys[keys.length - 1]), guard = 0;
  while (cur <= end && guard++ < 400) {
    var iso = isoDay(cur);
    out.push(byDay[iso] || { iso: iso, w: [], dur: [], out: [], pee: 0, poop: 0, n: 0 });
    cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
  }
  return out;
}
/* Parse/format YYYY-MM-DD in LOCAL time — `new Date("2026-07-26")` is UTC
   midnight, which renders as the previous day west of Greenwich. */
function parseDay(iso) { var p = iso.split("-"); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
function isoDay(dt) {
  var m = dt.getMonth() + 1, d = dt.getDate();
  return dt.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (d < 10 ? "0" : "") + d;
}
function fmtDay(iso) { return parseDay(iso).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
function fmtDur(s) { s = Math.round(s); return s >= 60 ? (Math.floor(s / 60) + "m " + (s % 60) + "s") : (s + "s"); }
function med(xs) { if (!xs || !xs.length) return null; var v = xs.slice().sort(function (a, b) { return a - b; }); return v[Math.floor(v.length / 2)]; }
function avg(xs) { if (!xs || !xs.length) return 0; var t = 0; xs.forEach(function (x) { t += x; }); return t / xs.length; }

/* One day-indexed chart: optional min/max band, optional dashed "normal" mean,
   plus a cursor line+dot moved by setCursor() (attribute updates only, so
   dragging stays smooth on the fridge's SoC). */
function dayChart(days, o, partial) {
  var W = 300, H = o.height || 96, pad = 8, n = days.length;
  var vals = [], los = [], his = [];
  days.forEach(function (d) {
    var v = o.value(d); if (v != null) vals.push(v);
    if (o.band && d.lo != null) { los.push(d.lo); his.push(d.hi); }
  });
  var lo, hi;
  if (o.zero) { lo = 0; hi = Math.max.apply(null, vals.concat([o.mean || 0, 1])) * 1.18; }
  else {
    var src = o.band && los.length ? los : vals, srcHi = o.band && his.length ? his : vals;
    lo = vals.length ? Math.min.apply(null, src) : 0; hi = vals.length ? Math.max.apply(null, srcHi) : 1;
    var p = (hi - lo) * 0.12 || 0.2; lo -= p; hi += p;
  }
  var rng = (hi - lo) || 1;
  function X(i) { return n > 1 ? pad + i * (W - pad * 2) / (n - 1) : W / 2; }
  function Y(v) { return pad + (1 - (v - lo) / rng) * (H - pad * 2); }

  /* min–max band, drawn per run of consecutive days that have data */
  var band = "";
  if (o.band) {
    var run = [];
    var flush = function () {
      if (run.length > 1) {
        var top = run.map(function (r, k) { return (k ? "L" : "M") + X(r.i).toFixed(1) + " " + Y(r.hi).toFixed(1); }).join(" ");
        var bot = run.slice().reverse().map(function (r) { return "L" + X(r.i).toFixed(1) + " " + Y(r.lo).toFixed(1); }).join(" ");
        band += top + " " + bot + " Z ";
      }
      run = [];
    };
    days.forEach(function (d, i) { if (d.lo == null) flush(); else run.push({ i: i, lo: d.lo, hi: d.hi }); });
    flush();
  }
  /* line, broken across days with no data */
  var line = "", pen = false;
  days.forEach(function (d, i) {
    var v = o.value(d);
    if (v == null) { pen = false; return; }
    line += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1) + " ";
    pen = true;
  });

  var meanY = o.mean != null ? Y(o.mean).toFixed(1) : null;
  var inner =
    (band ? '<path d="' + band + '" fill="' + o.color + '" fill-opacity="0.16"/>' : "") +
    (meanY != null ? '<line x1="' + pad + '" y1="' + meanY + '" x2="' + (W - pad) + '" y2="' + meanY + '" stroke="' + o.color + '" stroke-opacity=".5" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/>' : "") +
    /* today is incomplete — mark it so a partial day never reads as a real dip */
    (partial && n > 1 ? '<line x1="' + X(n - 1).toFixed(1) + '" y1="' + pad + '" x2="' + X(n - 1).toFixed(1) + '" y2="' + (H - pad) + '" stroke="var(--faint)" stroke-dasharray="2 3" stroke-width="1" vector-effect="non-scaling-stroke"/>' : "") +
    '<path d="' + line.trim() + '" fill="none" stroke="' + o.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<line class="cur-l" x1="0" y1="' + pad + '" x2="0" y2="' + (H - pad) + '" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>' +
    '<circle class="cur-d" r="3.6" fill="var(--ink)" style="display:none"/>';

  var box = el("div", "chart");
  box.innerHTML = '<svg style="width:100%;height:' + H + 'px;display:block" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + inner + '</svg>';
  var cl = box.querySelector(".cur-l"), cd = box.querySelector(".cur-d");
  return {
    node: box,
    setCursor: function (i) {
      var x = X(i);
      cl.setAttribute("x1", x); cl.setAttribute("x2", x); cl.style.display = "";
      var v = o.value(days[i]);
      if (v == null) { cd.style.display = "none"; return; }
      cd.setAttribute("cx", x); cd.setAttribute("cy", Y(v)); cd.style.display = "";
    }
  };
}

/* Drag/tap anywhere on a chart to pick a day. Maps clientX through the element's
   own rect, so it stays correct despite the non-uniform viewBox scaling.
   `touch-action: pan-y` keeps vertical page scrolling working on the panel. */
function scrub(node, n, onIndex) {
  var down = false;
  function idx(clientX) {
    var r = node.getBoundingClientRect();
    if (!r.width) return 0;
    var f = (clientX - r.left) / r.width;
    f = f < 0 ? 0 : (f > 1 ? 1 : f);
    return Math.round(f * (n - 1));
  }
  node.addEventListener("pointerdown", function (e) {
    down = true;
    if (node.setPointerCapture) { try { node.setPointerCapture(e.pointerId); } catch (err) {} }
    onIndex(idx(e.clientX));
  });
  node.addEventListener("pointermove", function (e) {
    if (down || e.pointerType === "mouse") onIndex(idx(e.clientX));
  });
  node.addEventListener("pointerup", function () { down = false; });
  node.addEventListener("pointercancel", function () { down = false; });
}

function chartSection(title, node, caption) {
  var g = el("div", "grp");
  g.appendChild(el("div", "grp-title", title));
  var card = el("div", "card"); card.appendChild(node);
  if (caption) card.appendChild(el("div", "minmax", caption));
  g.appendChild(card); return g;
}
function wrapCard(node) { var c = el("div", "card"); c.appendChild(node); return c; }

/* Box preference, each bar split pee vs poop — shows whether a cat picks a
   different box depending on what it's there to do. */
function splitBars(rows) {
  var max = Math.max.apply(null, rows.map(function (r) { return r.total; })) || 1;
  var wrap = el("div", "grp"); wrap.style.gap = "10px";
  rows.forEach(function (r) {
    var row = el("div", "brow");
    var lbl = el("div", "bl"); lbl.textContent = r.label;
    var track = el("div", "bt");
    var p = el("div"); p.style.cssText = "height:100%;background:var(--pee);width:" + (r.pee / max * 100) + "%;";
    var q = el("div"); q.style.cssText = "height:100%;background:var(--poop);width:" + (r.poop / max * 100) + "%;";
    track.appendChild(p); track.appendChild(q);
    var val = el("div", "bn");
    val.innerHTML = '<span style="color:var(--pee)">' + r.pee + '</span> / <span style="color:var(--poop)">' + r.poop + '</span>';
    row.appendChild(lbl); row.appendChild(track); row.appendChild(val);
    wrap.appendChild(row);
  });
  return wrap;
}
/* preview-only: synthesize ~30 days of plausible visits when /api/visits is
   unreachable (e.g. viewing this file outside the LAN). Live data replaces it. */
function synthVisits(cat) {
  var base = cat.weight || 9, out = [], boxes = ["piano room", "bonus room", "guest room 5"];
  var fav = Math.floor(Math.random() * 3), today = new Date();
  for (var back = 29; back >= 0; back--) {
    var dt = new Date(today.getFullYear(), today.getMonth(), today.getDate() - back);
    var iso = isoDay(dt);
    var drift = base + (29 - back) * ((Math.random() - 0.45) * 0.006);
    var pees = 3 + Math.floor(Math.random() * 4), poops = Math.random() < 0.75 ? 1 : 2;
    for (var k = 0; k < pees + poops; k++) {
      var isPee = k < pees, hh = (6 + k * 2) % 24;
      out.push({
        ts: iso + "T" + (hh < 10 ? "0" : "") + hh + ":00:00Z",
        box_name: boxes[Math.random() < 0.55 ? fav : Math.floor(Math.random() * 3)],
        weight: drift + (Math.random() - 0.5) * 0.18,
        waste: isPee ? "Urine" : "Feces",
        duration: (isPee ? 45 : 70) + Math.floor(Math.random() * 35),
        waste_weight: (isPee ? 30 : 55) + Math.floor(Math.random() * 20)
      });
    }
  }
  return out;
}

/* ---------- fetch + poll + wake ---------- */
function apiGet(path) {
  var opt = TOKEN ? { headers: { Authorization: "Bearer " + TOKEN } } : {};
  return fetch(path, opt).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}
function pull() {
  return Promise.all([apiGet("/api/latest"), apiGet("/api/history?days=10").catch(function () { return null; })])
    .then(function (res) {
      var m = model(res[0], res[1]); paint(m);
      try { localStorage.setItem("hearth.snap", JSON.stringify(res[0])); localStorage.setItem("hearth.hist", JSON.stringify(res[1] || {})); } catch (e) {}
      stamp(true);
    })
    .catch(function () { stamp(false); });
}
function stamp(ok) {
  var d = new Date(), hh = d.getHours() < 10 ? "0" + d.getHours() : d.getHours(), mm = d.getMinutes() < 10 ? "0" + d.getMinutes() : d.getMinutes();
  document.getElementById("updated").textContent = (ok ? "updated " : "offline · ") + hh + ":" + mm;
  document.getElementById("src").textContent = ok ? "live · polling 12s" : "offline — showing last data";
}
function tick() {
  var d = new Date(), h = d.getHours(), mi = d.getMinutes(), ap = h >= 12 ? "PM" : "AM", hh = (h % 12) || 12;
  document.getElementById("clock").textContent = hh + ":" + (mi < 10 ? "0" + mi : mi) + " " + ap;
  document.getElementById("date").textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}

window.addEventListener("hashchange", function () { if (LAST) paint(LAST); });

(function boot() {
  var snap = FALLBACK, hist = FALLBACK_HIST;
  try { var s = localStorage.getItem("hearth.snap"); if (s) snap = JSON.parse(s); var h = localStorage.getItem("hearth.hist"); if (h) hist = JSON.parse(h); } catch (e) {}
  paint(model(snap, hist));
  tick(); setInterval(tick, 10000);
  pull();
  setInterval(function () { if (!document.hidden) pull(); }, 12000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) pull(); });
  window.addEventListener("focus", pull);
  window.addEventListener("pageshow", pull);
  setInterval(function () { if (document.hidden) location.reload(); }, 20 * 60 * 1000);
})();
</script>
